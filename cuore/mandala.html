<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mandala con Cuore</title>
<style>
  :root{--creme:#FBF6EF;--apricot:#FCE9D6;--sand:#F1E6D8;--text:#2E2418;--bronze:#77570D;--button:#A85A2E;--salbei:#556640}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(circle at 50% 35%,#FFF6EA 0%,var(--apricot) 55%,#F6D9BC 100%);color:var(--text);font:17px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;-webkit-font-smoothing:antialiased}
  h1{margin:4px 0 2px;color:var(--bronze);font-size:clamp(24px,4.5vw,32px);font-weight:600;letter-spacing:.01em}
  .leise{margin:0 0 6px;color:#6E6152;text-align:center;max-width:46ch;transition:opacity 1.2s}
  .aussen{position:relative;width:min(760px,96vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .buehne{position:relative;width:78%;aspect-ratio:1}
  .buehne::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(253,201,122,.55),rgba(253,201,122,0) 68%);animation:atem 8s ease-in-out infinite;pointer-events:none}
  @keyframes atem{0%,100%{transform:scale(.96);opacity:.6}50%{transform:scale(1.03);opacity:1}}
  .buehne canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
  #farbe{filter:drop-shadow(0 10px 24px rgba(168,90,46,.15))}
  #linien{pointer-events:none}
  #flaeche{position:absolute;inset:0;border-radius:50%;touch-action:none}
  .topf{position:absolute;width:10.5%;aspect-ratio:1;margin:-5.25% 0 0 -5.25%;border:0;background:none;padding:0;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .topf svg{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(80,50,20,.25))}
  .topf:hover{transform:scale(1.1) rotate(-4deg)}
  .topf[aria-pressed="true"]{transform:scale(1.22) translateY(-4%)}
  .topf[aria-pressed="true"] svg{filter:drop-shadow(0 0 8px rgba(253,201,122,.95)) drop-shadow(0 3px 5px rgba(80,50,20,.25))}
  .modus{display:flex;gap:6px;margin:8px 0 4px}
  .modus button{font:inherit;font-size:14.5px;border:1px solid #E1CDB4;background:var(--creme);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
  .modus button[aria-pressed="true"]{background:var(--salbei);color:#fff;border-color:var(--salbei)}
  .knoepfe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  button.k{font:inherit;font-size:15px;font-weight:600;border:2px solid var(--button);background:transparent;color:var(--button);border-radius:999px;padding:8px 16px;cursor:pointer}
  button.k.voll{background:var(--button);color:#fff}
  .fuss{margin-top:16px;font-size:13.5px;color:#8A7A66;text-align:center}
  @media (prefers-reduced-motion:reduce){.buehne::before{animation:none}}
</style>
</head>
<body>
  <h1>Mandala con Cuore</h1>
  <p class="leise" id="hinweis">Atme ein. Tauch den Pinsel in einen Farbtopf – und mal einfach drauflos, Feld für Feld oder mit einem Strich über viele.</p>
  <div class="aussen" id="aussen"><div class="buehne"><canvas id="farbe"></canvas><canvas id="linien"></canvas><div id="flaeche" role="img" aria-label="Mandala zum Ausmalen"></div></div></div>
  <p class="leise" id="paletteName" style="margin:2px 0 0;font-size:14.5px">Farben: Ambiente con Cuore</p>
  <div class="modus" id="modus"><button type="button" data-m="einzeln" aria-pressed="true">✎ einzeln</button><button type="button" data-m="kreis" aria-pressed="false">✿ im Kreis</button></div>
  <div class="knoepfe">
    <button class="k" type="button" id="palette">🎨 Andere Farben</button>
    <button class="k" type="button" id="neu">✿ Neues Mandala</button>
    <button class="k" type="button" id="leer">Von vorn</button>
    <button class="k voll" type="button" id="speichern">Als Bild speichern</button>
  </div>
  <p class="fuss">Ein kleines Geschenk für Stefania – in den Farben von Ambiente con Cuore.</p>

<script>
// Mandala als Linienbild + Farbeimer: Linien werden gezeichnet, jede umschlossene Fläche (auch jede Überschneidung) ist ein Feld.
var PALETTEN = [
  { name: 'Ambiente con Cuore', farben: ['#F5BC86', '#D1864E', '#BF8B15', '#829761', '#ACB99C', '#F8DCC0', '#A85A2E', '#FFFDF9'] },
  { name: 'Abendrot', farben: ['#F7C59F', '#F29E6D', '#E07A5F', '#C8553D', '#9E3B4A', '#E8A0A8', '#F4D6B8', '#FFFDF9'] },
  { name: 'Mittelmeer', farben: ['#F6E7CB', '#E9C46A', '#8AB6C1', '#4F8FA3', '#2C6E8A', '#D97B5B', '#D8E8E4', '#FFFDF9'] },
  { name: 'Salbeigarten', farben: ['#E8EDDF', '#C5D3B5', '#A3B88C', '#829761', '#5E7247', '#D9C7A7', '#B5A27A', '#FFFDF9'] }
];
var palette = 0, FARBEN = PALETTEN[0].farben;
var LINIE = '#9C7A3C', GRUND = [255, 253, 249], S = 1200, M = S / 2, RAND = 575;
var cFarbe = document.getElementById('farbe'), cLinien = document.getElementById('linien'), flaeche = document.getElementById('flaeche');
cFarbe.width = cFarbe.height = cLinien.width = cLinien.height = S;
var gF = cFarbe.getContext('2d'), gL = cLinien.getContext('2d');
var farbe = FARBEN[0], modus = 'einzeln', seed = Date.now() % 100000, N = 12;
var marke, groesse, kasten, aussenMarke, bild;   // Feldnummer je Pixel, Feldgrößen, Begrenzungsrahmen, das Feld außerhalb, Farbpixel

function zufall(s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

// ---- Muster: Bänder von innen nach außen, alles streng N-fach symmetrisch ----
function kurve(rFn) { gL.beginPath(); for (var k = 0; k <= 720; k++) { var t = k / 720 * 2 * Math.PI, r = rFn(t); var x = M + r * Math.sin(t), y = M - r * Math.cos(t); k ? gL.lineTo(x, y) : gL.moveTo(x, y); } gL.closePath(); gL.stroke(); }
function kreis(x, y, r) { gL.beginPath(); gL.arc(x, y, r, 0, 2 * Math.PI); gL.stroke(); }
function blatt(w, a, b, breite) {   // spitzes Blatt von Radius a nach b, Mitte im Winkel w
  var p = function (r, ww) { return [M + r * Math.sin(ww), M - r * Math.cos(ww)]; }, m = (a + b) / 2;
  var s = p(a, w), e = p(b, w), l = p(m, w - breite), rr = p(m, w + breite);
  gL.beginPath(); gL.moveTo(s[0], s[1]); gL.quadraticCurveTo(l[0], l[1], e[0], e[1]); gL.quadraticCurveTo(rr[0], rr[1], s[0], s[1]); gL.stroke();
}
var STILE = {
  zopf: function (a, b, R) {   // zwei gegenläufige Wellen = geflochtenes Band voller Linsen
    var m = (a + b) / 2, h = (b - a) * .42, f = N * (R() < .5 ? 1 : 2);
    kurve(function (t) { return m + h * Math.sin(f * t); }); kurve(function (t) { return m - h * Math.sin(f * t); });
  },
  kreise: function (a, b, R) {   // überlappende Kreise auf dem Ring (wie die Blume des Lebens)
    var m = (a + b) / 2, n = N * (R() < .5 ? 1 : 2), rho = Math.min((b - a) / 2 - 2, m * Math.sin(Math.PI / n) * 1.45);
    for (var k = 0; k < n; k++) { var w = k * 2 * Math.PI / n; kreis(M + m * Math.sin(w), M - m * Math.cos(w), rho); }
  },
  blaetter: function (a, b, R) {   // überlappende Blätter, zwei Reihen versetzt
    var n = N, br = Math.PI / n * (1.1 + R() * .5);
    for (var k = 0; k < n; k++) { blatt(k * 2 * Math.PI / n, a + 3, b - 3, br); blatt((k + .5) * 2 * Math.PI / n, a + (b - a) * .25, b - 3, br * .7); }
  },
  welle: function (a, b, R) {   // Bogenrand + Tropfen in den Bögen
    var m = (a + b) / 2, h = (b - a) * .32, f = N * (R() < .5 ? 1 : 2);
    kurve(function (t) { return m + h * Math.abs(Math.sin(f * t / 2)) * 1.6 - h * .3; });
    for (var k = 0; k < f; k++) { var w = (k + .5) * 2 * Math.PI / f, r = m - h * .35; kreis(M + r * Math.sin(w), M - r * Math.cos(w), Math.min((b - a) * .16, r * Math.PI / f * .45)); }
  },
  strahlen: function (a, b, R) {   // Speichen mit Bogenkappen
    var n = N * 2;
    for (var k = 0; k < n; k++) { var w = k * 2 * Math.PI / n; gL.beginPath(); gL.moveTo(M + a * Math.sin(w), M - a * Math.cos(w)); gL.lineTo(M + b * Math.sin(w), M - b * Math.cos(w)); gL.stroke(); }
    var m = a + (b - a) * .55; kurve(function (t) { return m + (b - a) * .18 * Math.cos(n * t); });
  }
};
function bauen() {
  var R = zufall(seed); R(); R(); R(); N = [8, 12, 12, 16][Math.floor(R() * 4)];   // erste Zufallszahlen bei kleinem Startwert sind immer klein → verwerfen
  gL.clearRect(0, 0, S, S); gL.strokeStyle = LINIE; gL.lineWidth = 2.4; gL.lineJoin = 'round';
  // Mitte: kleine Blüte aus Kreisen
  var r0 = 55 + R() * 20; kreis(M, M, r0);
  for (var k = 0; k < N; k++) { var w = k * 2 * Math.PI / N; kreis(M + r0 * .5 * Math.sin(w), M - r0 * .5 * Math.cos(w), r0 * .5); }
  var r = r0, namen = Object.keys(STILE), letzter = '';
  var anzahl = Math.max(4, Math.round((RAND - r0) / (68 + R() * 14))), gewichte = [], summe = 0;   // Bänder gleichmäßig, nach außen leicht breiter
  for (var j = 0; j < anzahl; j++) { var gw = (1 + j * .06) * (.85 + R() * .3); gewichte.push(gw); summe += gw; }
  gewichte.forEach(function (gw) {
    var d = (RAND - r0) * gw / summe, stil; do { stil = namen[Math.floor(R() * namen.length)]; } while (stil === letzter); letzter = stil;
    STILE[stil](r, r + d, R); kreis(M, M, r + d); r += d;
  });
  kreis(M, M, RAND); gL.lineWidth = 3.2; kreis(M, M, RAND);
  felderFinden(); leeren();
}

// ---- Felder finden: jede zusammenhängende Fläche ohne Linie bekommt eine Nummer ----
function felderFinden() {
  var d = gL.getImageData(0, 0, S, S).data, n = S * S; marke = new Int32Array(n);
  for (var i = 0; i < n; i++) marke[i] = d[i * 4 + 3] > 110 ? -2 : -1;   // -2 = Linie
  var stapel = new Int32Array(n), nr = 0; groesse = []; kasten = [];
  for (var s = 0; s < n; s++) {
    if (marke[s] !== -1) continue;
    var oben = 0, cnt = 0, x0 = S, y0 = S, x1 = 0, y1 = 0; stapel[oben++] = s; marke[s] = nr;
    while (oben) {
      var p = stapel[--oben], x = p % S, y = (p / S) | 0; cnt++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && marke[p - 1] === -1) { marke[p - 1] = nr; stapel[oben++] = p - 1; }
      if (x < S - 1 && marke[p + 1] === -1) { marke[p + 1] = nr; stapel[oben++] = p + 1; }
      if (y > 0 && marke[p - S] === -1) { marke[p - S] = nr; stapel[oben++] = p - S; }
      if (y < S - 1 && marke[p + S] === -1) { marke[p + S] = nr; stapel[oben++] = p + S; }
    }
    groesse.push(cnt); kasten.push([x0, y0, x1, y1]); nr++;
  }
  aussenMarke = marke[0];
  // Winzige Krümel an Linienkreuzungen werden Linie, sonst bleiben weiße Pünktchen
  var winzig = groesse.map(function (g) { return g < 70; });
  if (winzig.some(Boolean)) {
    var li = gL.getImageData(0, 0, S, S), ld = li.data, rgb = [0x9C, 0x7A, 0x3C];
    for (var i2 = 0; i2 < n; i2++) { var mk = marke[i2]; if (mk >= 0 && winzig[mk]) { marke[i2] = -2; ld[i2 * 4] = rgb[0]; ld[i2 * 4 + 1] = rgb[1]; ld[i2 * 4 + 2] = rgb[2]; ld[i2 * 4 + 3] = 255; } }
    gL.putImageData(li, 0, 0);
  }
}

// ---- Farbe ----
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
var feldFarbe = {};
function leeren() {
  bild = gF.createImageData(S, S); var d = bild.data;
  for (var i = 0; i < S * S; i++) { var m = marke[i]; if (m === aussenMarke) continue; d[i * 4] = GRUND[0]; d[i * 4 + 1] = GRUND[1]; d[i * 4 + 2] = GRUND[2]; d[i * 4 + 3] = 255; }
  gF.putImageData(bild, 0, 0); feldFarbe = {};
}
function fuellen(nr, c) {
  if (nr < 0 || nr === aussenMarke || feldFarbe[nr] === c) return; feldFarbe[nr] = c;
  var rgb = hex(c), k = kasten[nr], d = bild.data;
  for (var y = k[1]; y <= k[3]; y++) for (var x = k[0]; x <= k[2]; x++) { var p = y * S + x; if (marke[p] === nr) { d[p * 4] = rgb[0]; d[p * 4 + 1] = rgb[1]; d[p * 4 + 2] = rgb[2]; d[p * 4 + 3] = 255; } }
  gF.putImageData(bild, 0, 0, k[0], k[1], k[2] - k[0] + 1, k[3] - k[1] + 1);
}
function feldBei(x, y) {   // auf einer Linie: nächstes Feld in der Nähe suchen
  x = Math.round(x); y = Math.round(y);
  for (var r = 0; r <= 4; r++) for (var dy = -r; dy <= r; dy++) for (var dx = -r; dx <= r; dx++) {
    var xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue; var m = marke[yy * S + xx]; if (m >= 0) return m; }
  return -1;
}
var zuletzt = null;
function malen(px, py) {
  var nr = feldBei(px, py); if (nr < 0 || nr === aussenMarke) return; var c = farbe;
  if (modus === 'einzeln') { fuellen(nr, c); leiser(); return; }
  if (nr === zuletzt && feldFarbe[nr] === c) return; zuletzt = nr;
  var w0 = Math.atan2(px - M, -(py - M)), r = Math.hypot(px - M, py - M), gesehen = {};
  for (var k = 0; k < N; k++) {   // derselbe Punkt N-mal um die Mitte gedreht
    var w = w0 + k * 2 * Math.PI / N, n2 = feldBei(M + r * Math.sin(w), M - r * Math.cos(w));
    if (n2 >= 0 && !gesehen[n2]) { gesehen[n2] = 1; (function (n3, i) { setTimeout(function () { fuellen(n3, c); }, i * 40); })(n2, k); }
  }
  leiser();
}
function punkt(e) { var b = flaeche.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * S, (e.clientY - b.top) / b.height * S]; }
var drueckt = false;
flaeche.addEventListener('pointerdown', function (e) { drueckt = true; zuletzt = null; var p = punkt(e); malen(p[0], p[1]); });
flaeche.addEventListener('pointermove', function (e) { if (drueckt) { var p = punkt(e); malen(p[0], p[1]); } });
addEventListener('pointerup', function () { drueckt = false; });
var leise = false; function leiser() { if (leise) return; leise = true; setTimeout(function () { document.getElementById('hinweis').style.opacity = '.35'; }, 4000); }

// ---- Farbtöpfe, Pinsel, Modus ----
function topfSvg(c) {
  return '<svg viewBox="0 0 64 64"><ellipse cx="32" cy="54" rx="21" ry="5" fill="rgba(80,50,20,.12)"/>' +
    '<path d="M12 22 L15 50 Q32 58 49 50 L52 22 Z" fill="#F4EBDD" stroke="#9C7A3C" stroke-width="1.6"/>' +
    '<path d="M14 30 Q32 36 50 30" fill="none" stroke="#E2D2BC" stroke-width="1.4"/>' +
    '<ellipse cx="32" cy="22" rx="20" ry="7" fill="' + c + '" stroke="#9C7A3C" stroke-width="1.6"/>' +
    '<ellipse cx="26" cy="20.5" rx="7" ry="2" fill="rgba(255,255,255,.35)"/>' +
    '<path d="M44 24 Q45 31 43 35 Q41.5 37 41 33 Q41 28 42 24 Z" fill="' + c + '" stroke="#9C7A3C" stroke-width="1"/></svg>';
}
function pinsel(c) {
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">' +
    '<path d="M38 2 L22 18" stroke="#7A5230" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M24 16 L18 22" stroke="#B8B2A7" stroke-width="7" stroke-linecap="butt"/>' +
    '<path d="M19 21 Q13 21 8 28 Q4 34 2 38 Q6 36 12 32 Q19 27 19 21 Z" fill="' + c + '" stroke="#5E4426" stroke-width="1.2"/></svg>';
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(s) + '") 2 38, crosshair';
}
var aussen = document.getElementById('aussen'), toepfe = [];
FARBEN.forEach(function (c, i) {
  var w = -Math.PI / 2 + i * 2 * Math.PI / FARBEN.length, rad = 45;
  var b = document.createElement('button'); b.className = 'topf'; b.type = 'button'; b.innerHTML = topfSvg(c);
  b.style.left = (50 + rad * Math.cos(w)) + '%'; b.style.top = (50 + rad * Math.sin(w)) + '%';
  b.setAttribute('aria-label', 'Farbtopf ' + (i + 1)); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = function () { farbe = FARBEN[i]; flaeche.style.cursor = pinsel(farbe); toepfe.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  toepfe.push(b); aussen.appendChild(b);
});
flaeche.style.cursor = pinsel(farbe);
// Andere Farben: die Töpfe bekommen neue Farben, schon Gemaltes bleibt wie es ist
document.getElementById('palette').onclick = function () {
  palette = (palette + 1) % PALETTEN.length; FARBEN = PALETTEN[palette].farben;
  toepfe.forEach(function (b, i) { b.innerHTML = topfSvg(FARBEN[i]); });
  var aktiv = Math.max(0, toepfe.findIndex(function (b) { return b.getAttribute('aria-pressed') === 'true'; }));
  farbe = FARBEN[aktiv]; flaeche.style.cursor = pinsel(farbe);
  document.getElementById('paletteName').textContent = 'Farben: ' + PALETTEN[palette].name;
};
document.querySelectorAll('#modus button').forEach(function (b) { b.onclick = function () { modus = b.getAttribute('data-m'); document.querySelectorAll('#modus button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }; });
document.getElementById('neu').onclick = function () { seed = (seed * 7 + 13) % 100000 + 1; bauen(); };
document.getElementById('leer').onclick = leeren;
document.getElementById('speichern').onclick = function () {
  var c = document.createElement('canvas'); c.width = c.height = S; var g = c.getContext('2d');
  g.fillStyle = '#FCE9D6'; g.fillRect(0, 0, S, S); g.drawImage(cFarbe, 0, 0); g.drawImage(cLinien, 0, 0);
  c.toBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mandala-con-cuore.png'; document.body.appendChild(a); a.click(); a.remove(); }, 'image/png');
};
bauen();
</script>
</body>
</html>
