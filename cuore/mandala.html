<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mandala con Cuore</title>
<style>
  :root{--creme:#FBF6EF;--apricot:#FCE9D6;--sand:#F1E6D8;--text:#2E2418;--bronze:#77570D;--button:#A85A2E;--salbei:#556640}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(circle at 50% 35%,#FFF6EA 0%,var(--apricot) 55%,#F6D9BC 100%);color:var(--text);font:17px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;-webkit-font-smoothing:antialiased}
  h1{margin:4px 0 2px;color:var(--bronze);font-size:clamp(24px,4.5vw,32px);font-weight:600;letter-spacing:.01em}
  .leise{margin:0 0 14px;color:#6E6152;text-align:center;max-width:46ch;transition:opacity 1.2s}
  .buehne{position:relative;width:min(560px,92vw);aspect-ratio:1}
  .buehne::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(253,201,122,.55),rgba(253,201,122,0) 68%);animation:atem 8s ease-in-out infinite;pointer-events:none}
  @keyframes atem{0%,100%{transform:scale(.96);opacity:.6}50%{transform:scale(1.03);opacity:1}}
  svg{position:relative;width:100%;height:100%;touch-action:none;cursor:crosshair;filter:drop-shadow(0 10px 24px rgba(168,90,46,.15))}
  svg path,svg circle{transition:fill .9s ease}
  .farben{display:flex;gap:12px;margin:18px 0 10px;flex-wrap:wrap;justify-content:center}
  .farbe{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;transition:transform .3s}
  .farbe[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 3px var(--bronze),0 4px 12px rgba(0,0,0,.15)}
  .knoepfe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  button.k{font:inherit;font-size:15px;font-weight:600;border:2px solid var(--button);background:transparent;color:var(--button);border-radius:999px;padding:8px 16px;cursor:pointer}
  button.k.voll{background:var(--button);color:#fff}
  .fuss{margin-top:16px;font-size:13.5px;color:#8A7A66;text-align:center}
  @media (prefers-reduced-motion:reduce){.buehne::before{animation:none}svg path,svg circle{transition:none}}
</style>
</head>
<body>
  <h1>Mandala con Cuore</h1>
  <p class="leise" id="hinweis">Atme ein. Wähle eine Farbe – und fahr einfach mit dem Finger oder der Maus über das Mandala. Den Rest macht es von selbst.</p>
  <div class="buehne"><svg id="m" viewBox="-300 -300 600 600" role="img" aria-label="Mandala zum Ausmalen"></svg></div>
  <div class="farben" id="farben"></div>
  <div class="knoepfe">
    <button class="k" type="button" id="neu">✿ Neues Mandala</button>
    <button class="k" type="button" id="leer">Von vorn</button>
    <button class="k voll" type="button" id="speichern">Als Bild speichern</button>
  </div>
  <p class="fuss">Ein kleines Geschenk für Stefania – in den Farben von Ambiente con Cuore.</p>

<script>
// Die Farben aus dem Logo, ein paar zarte Zwischentöne dazu
var FARBEN = ['#F5BC86', '#D1864E', '#BF8B15', '#829761', '#ACB99C', '#F8DCC0', '#A85A2E', '#FBF6EF'];
var LINIE = '#9C7A3C', LEER = '#FFFDF9';
var svg = document.getElementById('m'), NS = 'http://www.w3.org/2000/svg';
var farbe = FARBEN[0], seed = Date.now() % 100000;

function zufall(s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function pt(r, w) { return [r * Math.cos(w), r * Math.sin(w)]; }
function f(p) { return p[0].toFixed(2) + ' ' + p[1].toFixed(2); }
function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }

// Ein Mandala aus Ringen: jeder Ring hat Segmente (Sektoren) und darüber eine Form (Blatt, Bogen, Tropfen).
// Alle Teile eines Rings mit gleicher Form gehören zu einer Gruppe – wer eins anmalt, malt den ganzen Kreis.
function bauen() {
  svg.innerHTML = '<defs><clipPath id="rand"><circle r="290.6"/></clipPath></defs>'; var ziel = el('g', { 'clip-path': 'url(#rand)' }); svg.appendChild(ziel); var R = zufall(seed), gruppe = 0;
  var ringe = [], r = 34; while (r < 285) { var d = 26 + R() * 34; ringe.push([r, Math.min(r + d, 290)]); r += d; }
  var zahlen = [8, 12, 16];
  var mitte = el('circle', { cx: 0, cy: 0, r: 34, 'data-g': gruppe++ }); ziel.appendChild(mitte);
  ringe.forEach(function (ring, i) {
    var a = ring[0], b = ring[1], n = zahlen[Math.min(zahlen.length - 1, Math.floor(i / 2 + R() * 1.5))], schritt = 2 * Math.PI / n, versatz = (i % 2) * schritt / 2;
    var gSektor = gruppe++, gForm = gruppe++, form = ['blatt', 'bogen', 'tropfen', 'blatt'][Math.floor(R() * 4)];
    for (var k = 0; k < n; k++) {
      var w0 = k * schritt + versatz, w1 = w0 + schritt, wm = w0 + schritt / 2;
      // Sektor (der Grund des Rings)
      ziel.appendChild(el('path', { 'data-g': gSektor, d: 'M' + f(pt(a, w0)) + ' L' + f(pt(b, w0)) + ' A' + b + ' ' + b + ' 0 0 1 ' + f(pt(b, w1)) + ' L' + f(pt(a, w1)) + ' A' + a + ' ' + a + ' 0 0 0 ' + f(pt(a, w0)) + 'Z' }));
      // Die Form darüber
      if (form === 'blatt') {
        var breite = schritt * .42;
        ziel.appendChild(el('path', { 'data-g': gForm, d: 'M' + f(pt(a + 2, wm)) + ' Q' + f(pt((a + b) / 2, wm - breite)) + ' ' + f(pt(b - 2, wm)) + ' Q' + f(pt((a + b) / 2, wm + breite)) + ' ' + f(pt(a + 2, wm)) + 'Z' }));
      } else if (form === 'bogen') {
        var m = a + (b - a) * .35;
        ziel.appendChild(el('path', { 'data-g': gForm, d: 'M' + f(pt(m, w0 + schritt * .08)) + ' Q' + f(pt(b + (b - a) * .25, wm)) + ' ' + f(pt(m, w1 - schritt * .08)) + ' A' + m + ' ' + m + ' 0 0 0 ' + f(pt(m, w0 + schritt * .08)) + 'Z' }));
      } else {
        var c = pt((a + b) / 2, wm), rr = Math.min((b - a) * .3, (a + b) / 2 * Math.sin(schritt / 2) * .55);
        ziel.appendChild(el('circle', { 'data-g': gForm, cx: c[0].toFixed(2), cy: c[1].toFixed(2), r: rr.toFixed(2) }));
      }
    }
  });
  [].forEach.call(ziel.children, function (x) { x.setAttribute('fill', LEER); x.setAttribute('stroke', LINIE); x.setAttribute('stroke-width', '1.1'); x.setAttribute('stroke-linejoin', 'round'); });
}

// Malen: tippen oder einfach drüberfahren – die ganze Gruppe nimmt die Farbe an
var malt = false, zuletzt = null;
function anmalen(x, y) {
  var t = document.elementFromPoint(x, y); if (!t || !t.getAttribute || t.getAttribute('data-g') == null) return;
  var g = t.getAttribute('data-g'), c = farbe; if (g === zuletzt && t.getAttribute('fill') === c) return; zuletzt = g;
  svg.querySelectorAll('[data-g="' + g + '"]').forEach(function (e, i) { setTimeout(function () { e.setAttribute('fill', c); }, i * 35); });   // läuft einmal im Kreis herum
  leiser();
}
svg.addEventListener('pointerdown', function (e) { malt = true; zuletzt = null; anmalen(e.clientX, e.clientY); });
svg.addEventListener('pointermove', function (e) { if (malt || e.pointerType === 'mouse' && e.buttons) anmalen(e.clientX, e.clientY); });
addEventListener('pointerup', function () { malt = false; });
var leise = false; function leiser() { if (leise) return; leise = true; setTimeout(function () { document.getElementById('hinweis').style.opacity = '.35'; }, 4000); }

// Farbwahl
var fb = document.getElementById('farben');
FARBEN.forEach(function (c, i) {
  var b = document.createElement('button'); b.className = 'farbe'; b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', 'Farbe ' + (i + 1)); b.setAttribute('aria-pressed', String(i === 0));
  b.onclick = function () { farbe = c; fb.querySelectorAll('.farbe').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  fb.appendChild(b);
});
document.getElementById('neu').onclick = function () { seed = (seed * 7 + 13) % 100000 + 1; bauen(); };
document.getElementById('leer').onclick = function () { svg.querySelectorAll('[data-g]').forEach(function (e) { e.setAttribute('fill', LEER); }); };

// Als Bild speichern (PNG, 1600 × 1600)
document.getElementById('speichern').onclick = function () {
  var kopie = svg.cloneNode(true); kopie.setAttribute('xmlns', NS); kopie.setAttribute('width', 1600); kopie.setAttribute('height', 1600);
  var bild = new Image(), url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(kopie)], { type: 'image/svg+xml' }));
  bild.onload = function () {
    var c = document.createElement('canvas'); c.width = c.height = 1600; var g = c.getContext('2d');
    g.fillStyle = '#FCE9D6'; g.fillRect(0, 0, 1600, 1600); g.drawImage(bild, 0, 0, 1600, 1600); URL.revokeObjectURL(url);
    c.toBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'mandala-con-cuore.png'; document.body.appendChild(a); a.click(); a.remove(); }, 'image/png');
  };
  bild.src = url;
};
bauen();
</script>
</body>
</html>
