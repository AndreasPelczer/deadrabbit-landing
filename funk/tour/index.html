<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Funk Tour</title>
<style>
  :root{--pink:#E5007E;--pink-hell:#FCE6F1;--tinte:#22201C;--grau:#6B665E;--linie:#E4DED3;--papier:#FAF7F1;--gruen:#1f8a4c}
  *{box-sizing:border-box} [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{background:#2b2926;font:18px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinte);-webkit-font-smoothing:antialiased}
  .handy{max-width:440px;min-height:100%;margin:0 auto;background:var(--papier);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .kopf{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;color:var(--grau);margin-bottom:10px}
  .kopf b{color:var(--pink)}
  .fortschritt{display:flex;gap:4px;margin-bottom:16px}
  .fortschritt i{flex:1;height:7px;border-radius:9px;background:#e3ddd2}
  .fortschritt i.f{background:var(--gruen)} .fortschritt i.j{background:var(--pink)}
  .gross{flex:1;display:flex;flex-direction:column;justify-content:center}
  .wort{font-size:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);margin:0 0 6px}
  h1{font-size:34px;line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
  .was{font-size:24px;font-weight:800;line-height:1.25;margin:0 0 14px}
  .mulde{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--linie);border-radius:16px;padding:10px 14px;font-weight:900;font-size:22px;margin:0 0 14px;align-self:flex-start}
  .mulde .g{background:var(--pink);color:#fff;border-radius:10px;padding:2px 10px}
  a.ort{display:block;color:var(--tinte);font-size:17px;text-decoration:none;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:12px 14px}
  a.ort small{display:block;color:var(--pink);font-weight:800;font-size:13px}
  .knoepfe{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .k{font:inherit;font-size:22px;font-weight:900;border:0;border-radius:20px;padding:20px 16px;cursor:pointer;width:100%}
  .k.ja{background:var(--pink);color:#fff;box-shadow:0 6px 0 #a3005a}
  .k.nein{background:#fff;color:var(--tinte);border:2px solid var(--linie);font-size:18px;padding:14px}
  .k:active{transform:translateY(3px);box-shadow:none}
  svg.karte{width:100%;height:auto;background:#e6eedd;border-radius:18px;display:block;margin:6px 0 12px}
  .klein{font-size:15px;color:var(--grau)}
  .bild{width:100%;border-radius:16px;display:block;margin:8px 0}
  .ok{font-size:72px;text-align:center;margin:0}
  .karte2{background:#fff;border:1px solid var(--linie);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:16px}
  .karte2 h3{margin:0 0 4px;font-size:17px}
  .warn{background:#FFF8D6;border-color:#F0DC7A}
  .balken{height:10px;border-radius:9px;background:#e3ddd2;overflow:hidden;margin:6px 0 2px}.balken i{display:block;height:100%;background:var(--gruen)}
  details{margin-top:6px} pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#f1ede6;border-radius:12px;padding:10px;max-height:300px;overflow:auto}
</style>
</head>
