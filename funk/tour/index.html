<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Funk Tour</title>
<style>
  :root{--pink:#E5007E;--pink-hell:#FCE6F1;--tinte:#22201C;--grau:#6B665E;--linie:#E4DED3;--papier:#FAF7F1;--gruen:#1f8a4c;--gelb:#FFE45C}
  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;background:#2b2926;font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinte);-webkit-font-smoothing:antialiased}
  .handy{max-width:440px;min-height:100vh;margin:0 auto;background:var(--papier);display:flex;flex-direction:column}
  header{background:var(--tinte);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
  header .zeile{display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:18px} header small{color:#ffb3d9;font-weight:700}
  .wahl{display:flex;gap:6px;margin-top:10px}
  .wahl button{flex:1;font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px;background:#3a3835;color:#ddd;cursor:pointer}
  .wahl button[aria-pressed=true]{background:var(--pink);color:#fff}
  main{flex:1;padding:14px 14px 96px}
  .karte{background:#fff;border:1px solid var(--linie);border-radius:18px;padding:14px;margin-bottom:12px}
  .jetzt{border:2px solid var(--pink);box-shadow:0 6px 20px rgba(229,0,126,.12)}
  .marke{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
  h2{font-size:22px;margin:4px 0 6px;line-height:1.2} h3{font-size:17px;margin:0 0 4px}
  .klein{font-size:14px;color:var(--grau)}
  .knopf{display:block;width:100%;font:inherit;font-size:18px;font-weight:900;border:0;border-radius:16px;padding:16px;margin-top:10px;cursor:pointer;text-align:center;text-decoration:none}
  .voll{background:var(--pink);color:#fff} .leer{background:var(--pink-hell);color:var(--pink)} .still{background:#efebe4;color:var(--tinte);font-size:15px;padding:12px}
  .liste{list-style:none;margin:0;padding:0}
  .liste li{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--linie)}
  .liste li:first-child{border-top:0}
  .liste .uhr{font-weight:800;font-variant-numeric:tabular-nums;min-width:46px}
  .liste .fertig{color:var(--gruen)} .liste .offen{color:var(--grau)}
  .foto{width:100%;border-radius:12px;display:block;margin-top:8px}
  .warn{background:#FFF8D6;border:1px solid #F0DC7A}
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;display:flex;background:#fff;border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
  nav button{flex:1;font:inherit;font-size:13px;font-weight:800;border:0;background:none;padding:10px 4px 12px;color:var(--grau);cursor:pointer}
  nav button span{display:block;font-size:22px}
  nav button[aria-pressed=true]{color:var(--pink)}
  .zaehler{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:2px}
  pre{white-space:pre-wrap;word-break:break-all;font-size:11.5px;background:#f1ede6;border-radius:12px;padding:10px;max-height:340px;overflow:auto}
  input[type=number],select{font:inherit;width:100%;padding:10px;border-radius:12px;border:1px solid var(--linie);margin-top:6px;background:#fff}
  .toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;transition:.3s;background:var(--tinte);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;z-index:9;max-width:90vw;text-align:center}
  .toast.zeigen{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="handy">
  <header>
    <div class="zeile"><b>📱 Funk Tour</b><small id="kopfTag"></small></div>
    <div class="wahl" id="lkwWahl"></div>
  </header>
  <main id="inhalt"></main>
</div>
<nav>
  <button data-ansicht="tour" aria-pressed="true"><span>🚛</span>Tour</button>
  <button data-ansicht="buero" aria-pressed="false"><span>🏢</span>Büro <span class="zaehler" id="bueroZahl" hidden>0</span></button>
  <button data-ansicht="protokoll" aria-pressed="false"><span>📋</span>Protokoll</button>
</nav>
<input type="file" id="kamera" accept="image/*" capture="environment" hidden>
