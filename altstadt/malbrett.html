<!doctype html>
<html lang="de">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malbrett – Rosette</title>
<style>
  /* 15.10. Malbrett: eine Rosette (Maßwerk) mit selbst geriebenen Farben ausmalen. Technik aus dem „Mandala con Cuore“
     (ambiente-con-cuore/portal/seite/mandala.html): Linien zeichnen, jede umschlossene Fläche ist ein Feld, Farbeimer füllt. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 40%,#5a4026 0%,#2e2014 70%,#1c130b 100%);color:#efe2c0;font:16px/1.45 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px 16px;overflow:hidden}
  h1{margin:0;font-size:26px;font-weight:normal;letter-spacing:.06em;color:#f0d9a0}
  .leise{margin:2px 0 4px;color:#c8b48a;font-size:14.5px;text-align:center;max-width:52ch}
  .aussen{position:relative;width:min(80vh,94vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .buehne{position:relative;width:76%;aspect-ratio:1}
  .buehne::before{content:"";position:absolute;inset:-5%;border-radius:50%;background:radial-gradient(circle,rgba(255,190,110,.35),rgba(255,190,110,0) 68%);pointer-events:none}
  .buehne canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
  #farbe{box-shadow:0 0 0 10px #6b4a2a,0 0 0 13px #3a2614,0 12px 40px rgba(0,0,0,.6)}
  #linien{pointer-events:none}
  #flaeche{position:absolute;inset:0;border-radius:50%;touch-action:none}
  .topf{position:absolute;width:11%;aspect-ratio:1;margin:-5.5% 0 0 -5.5%;border:0;background:none;padding:0;cursor:pointer;transition:transform .3s}
  .topf svg{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .topf b{position:absolute;right:-6%;bottom:-2%;background:#2e2014;color:#f0d9a0;border:1px solid #a07a40;border-radius:9px;font:bold 11px/1 monospace;padding:3px 5px}
  .topf[aria-pressed="true"]{transform:scale(1.2) translateY(-4%)}
  .topf[aria-pressed="true"] svg{filter:drop-shadow(0 0 8px rgba(255,200,120,.9)) drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .topf[disabled]{opacity:.35;cursor:default;transform:none}
  .reihe{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  button.k{font:inherit;font-size:15px;border:1px solid #a07a40;background:#3a2614;color:#f0d9a0;border-radius:6px;padding:7px 14px;cursor:pointer}
  button.k.voll{background:#8a5a24;border-color:#d8a860}
  button.k[aria-pressed="true"]{background:#5e7247;border-color:#a3b88c}
</style>
</head>
<body>
  <h1>Rosette</h1>
  <p class="leise" id="hinweis">Tauch den Pinsel in einen Topf und mal. Ein Töpfchen reicht für <span id="jeTopf">15</span> Felder.</p>
  <div class="aussen" id="aussen"><div class="buehne"><canvas id="farbe"></canvas><canvas id="linien"></canvas><div id="flaeche"></div></div></div>
  <div class="reihe">
    <button class="k" type="button" id="m_einzeln" aria-pressed="true">✎ einzeln</button>
    <button class="k" type="button" id="m_kreis" aria-pressed="false">✿ im Kreis</button>
    <button class="k" type="button" id="neu">Andere Rosette</button>
    <button class="k" type="button" id="weg">Weglegen</button>
    <button class="k voll" type="button" id="fertig">Fertig – an die Wand hängen</button>
  </div>
<script>
var LINIE = '#4a2e16', GRUND = [242, 235, 221], S = 1000, M = S / 2, RAND = 480, JE_TOPF = 15;
// Ohne Spiel (zum Ausprobieren): ein paar Farben. Das Spiel schickt die echten Töpfe per postMessage.
var TOEPFE = [{ id: 'roetel', name: 'Rötel', hex: '#a0442c', n: 2 }, { id: 'ocker', name: 'Ocker', hex: '#c8962e', n: 2 }, { id: 'gruenerde', name: 'Grünerde', hex: '#7a8a5a', n: 1 }, { id: 'kalk', name: 'Kalkweiß', hex: '#f4f0e6', n: 1 }];
var cF = document.getElementById('farbe'), cL = document.getElementById('linien'), flaeche = document.getElementById('flaeche');
cF.width = cF.height = cL.width = cL.height = S; var gF = cF.getContext('2d'), gL = cL.getContext('2d');
var farbe = null, modus = 'einzeln', seed = Date.now() % 100000, N = 12, marke, groesse, kasten, aussenMarke, bild, feldFarbe = {}, verbraucht = {};

function zufall(s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function kurve(rFn) { gL.beginPath(); for (var k = 0; k <= 720; k++) { var t = k / 720 * 2 * Math.PI, r = rFn(t); var x = M + r * Math.sin(t), y = M - r * Math.cos(t); k ? gL.lineTo(x, y) : gL.moveTo(x, y); } gL.closePath(); gL.stroke(); }
function kreis(x, y, r) { gL.beginPath(); gL.arc(x, y, r, 0, 2 * Math.PI); gL.stroke(); }
function blatt(w, a, b, br) { var p = function (r, ww) { return [M + r * Math.sin(ww), M - r * Math.cos(ww)]; }, m = (a + b) / 2, s = p(a, w), e = p(b, w), l = p(m, w - br), rr = p(m, w + br);
  gL.beginPath(); gL.moveTo(s[0], s[1]); gL.quadraticCurveTo(l[0], l[1], e[0], e[1]); gL.quadraticCurveTo(rr[0], rr[1], s[0], s[1]); gL.stroke(); }
var STILE = {
  zopf: function (a, b, R) { var m = (a + b) / 2, h = (b - a) * .42, f = N * (R() < .5 ? 1 : 2); kurve(function (t) { return m + h * Math.sin(f * t); }); kurve(function (t) { return m - h * Math.sin(f * t); }); },
  kreise: function (a, b, R) { var m = (a + b) / 2, n = N * (R() < .5 ? 1 : 2), rho = Math.min((b - a) / 2 - 2, m * Math.sin(Math.PI / n) * 1.45); for (var k = 0; k < n; k++) { var w = k * 2 * Math.PI / n; kreis(M + m * Math.sin(w), M - m * Math.cos(w), rho); } },
  blaetter: function (a, b, R) { var br = Math.PI / N * (1.1 + R() * .5); for (var k = 0; k < N; k++) { blatt(k * 2 * Math.PI / N, a + 3, b - 3, br); blatt((k + .5) * 2 * Math.PI / N, a + (b - a) * .25, b - 3, br * .7); } },
  bogen: function (a, b, R) {   // gotischer Spitzbogen-Kranz (Maßwerk)
    var n = N, m = a + (b - a) * .2;
    for (var k = 0; k < n; k++) { var w0 = k * 2 * Math.PI / n, w1 = (k + 1) * 2 * Math.PI / n, wm = (w0 + w1) / 2, p = function (r, ww) { return [M + r * Math.sin(ww), M - r * Math.cos(ww)]; };
      var s = p(m, w0), e = p(m, w1), sp = p(b - 4, wm), c1 = p(b - 4, w0 + (w1 - w0) * .15), c2 = p(b - 4, w1 - (w1 - w0) * .15);
      gL.beginPath(); gL.moveTo(s[0], s[1]); gL.quadraticCurveTo(c1[0], c1[1], sp[0], sp[1]); gL.quadraticCurveTo(c2[0], c2[1], e[0], e[1]); gL.stroke(); } },
  strahlen: function (a, b, R) { var n = N * 2; for (var k = 0; k < n; k++) { var w = k * 2 * Math.PI / n; gL.beginPath(); gL.moveTo(M + a * Math.sin(w), M - a * Math.cos(w)); gL.lineTo(M + b * Math.sin(w), M - b * Math.cos(w)); gL.stroke(); }
    var m = a + (b - a) * .55; kurve(function (t) { return m + (b - a) * .18 * Math.cos(n * t); }); }
};
function bauen() {
  var R = zufall(seed); R(); R(); R(); N = [6, 8, 12, 12][Math.floor(R() * 4)];   // Rosetten haben oft 6, 8 oder 12 Pässe
  gL.clearRect(0, 0, S, S); gL.strokeStyle = LINIE; gL.lineWidth = 2.6; gL.lineJoin = 'round';
  var r0 = 50 + R() * 18; kreis(M, M, r0); for (var k = 0; k < N; k++) { var w = k * 2 * Math.PI / N; kreis(M + r0 * .5 * Math.sin(w), M - r0 * .5 * Math.cos(w), r0 * .5); }
  var r = r0, namen = Object.keys(STILE), letzter = '', anzahl = Math.max(4, Math.round((RAND - r0) / (66 + R() * 12))), gew = [], summe = 0;
  for (var j = 0; j < anzahl; j++) { var gw = (1 + j * .06) * (.85 + R() * .3); gew.push(gw); summe += gw; }
  gew.forEach(function (gw) { var d = (RAND - r0) * gw / summe, stil; do { stil = namen[Math.floor(R() * namen.length)]; } while (stil === letzter); letzter = stil; STILE[stil](r, r + d, R); kreis(M, M, r + d); r += d; });
  gL.lineWidth = 3.4; kreis(M, M, RAND); felderFinden(); leeren();
}
function felderFinden() {
  var d = gL.getImageData(0, 0, S, S).data, n = S * S; marke = new Int32Array(n); for (var i = 0; i < n; i++) marke[i] = d[i * 4 + 3] > 110 ? -2 : -1;
  var st = new Int32Array(n), nr = 0; groesse = []; kasten = [];
  for (var s = 0; s < n; s++) { if (marke[s] !== -1) continue; var o = 0, c = 0, x0 = S, y0 = S, x1 = 0, y1 = 0; st[o++] = s; marke[s] = nr;
    while (o) { var p = st[--o], x = p % S, y = (p / S) | 0; c++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && marke[p - 1] === -1) { marke[p - 1] = nr; st[o++] = p - 1; } if (x < S - 1 && marke[p + 1] === -1) { marke[p + 1] = nr; st[o++] = p + 1; }
      if (y > 0 && marke[p - S] === -1) { marke[p - S] = nr; st[o++] = p - S; } if (y < S - 1 && marke[p + S] === -1) { marke[p + S] = nr; st[o++] = p + S; } }
    groesse.push(c); kasten.push([x0, y0, x1, y1]); nr++; }
  aussenMarke = marke[0];
  var li = gL.getImageData(0, 0, S, S), ld = li.data, klein = false;   // Krümel an Kreuzungen werden Linie
  for (var q = 0; q < n; q++) { var mk = marke[q]; if (mk >= 0 && groesse[mk] < 60) { marke[q] = -2; ld[q * 4] = 0x4a; ld[q * 4 + 1] = 0x2e; ld[q * 4 + 2] = 0x16; ld[q * 4 + 3] = 255; klein = true; } }
  if (klein) gL.putImageData(li, 0, 0);
}
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function leeren() { bild = gF.createImageData(S, S); var d = bild.data; for (var i = 0; i < S * S; i++) { if (marke[i] === aussenMarke) continue; d[i * 4] = GRUND[0]; d[i * 4 + 1] = GRUND[1]; d[i * 4 + 2] = GRUND[2]; d[i * 4 + 3] = 255; } gF.putImageData(bild, 0, 0); feldFarbe = {}; verbraucht = {}; toepfeZeigen(); }
function rest(t) { return t.n * JE_TOPF - (verbraucht[t.id] || 0); }
function fuellen(nr, t) {
  if (nr < 0 || nr === aussenMarke || feldFarbe[nr] === t.id) return false; if (rest(t) <= 0) { leer(t); return false; }
  feldFarbe[nr] = t.id; verbraucht[t.id] = (verbraucht[t.id] || 0) + 1;
  var rgb = hex(t.hex), k = kasten[nr], d = bild.data;
  for (var y = k[1]; y <= k[3]; y++) for (var x = k[0]; x <= k[2]; x++) { var p = y * S + x; if (marke[p] === nr) { d[p * 4] = rgb[0]; d[p * 4 + 1] = rgb[1]; d[p * 4 + 2] = rgb[2]; d[p * 4 + 3] = 255; } }
  gF.putImageData(bild, 0, 0, k[0], k[1], k[2] - k[0] + 1, k[3] - k[1] + 1); toepfeZeigen(); return true;
}
function leer(t) { document.getElementById('hinweis').textContent = t.name + ' ist aufgebraucht. Reib am Reibstein neue Farbe – oder nimm einen anderen Topf.'; }
function feldBei(x, y) { x = Math.round(x); y = Math.round(y); for (var r = 0; r <= 4; r++) for (var dy = -r; dy <= r; dy++) for (var dx = -r; dx <= r; dx++) { var xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue; var m = marke[yy * S + xx]; if (m >= 0) return m; } return -1; }
var zuletzt = null;
function malen(px, py) {
  if (!farbe) return; var nr = feldBei(px, py); if (nr < 0 || nr === aussenMarke) return; var t = farbe;
  if (modus === 'einzeln') { fuellen(nr, t); return; }
  if (nr === zuletzt && feldFarbe[nr] === t.id) return; zuletzt = nr;
  var w0 = Math.atan2(px - M, -(py - M)), r = Math.hypot(px - M, py - M), gesehen = {}, liste = [];
  for (var k = 0; k < N; k++) { var w = w0 + k * 2 * Math.PI / N, n2 = feldBei(M + r * Math.sin(w), M - r * Math.cos(w)); if (n2 >= 0 && !gesehen[n2]) { gesehen[n2] = 1; liste.push(n2); } }
  liste.forEach(function (n3, i) { setTimeout(function () { fuellen(n3, t); }, i * 40); });
}
function punkt(e) { var b = flaeche.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * S, (e.clientY - b.top) / b.height * S]; }
var drueckt = false;
flaeche.addEventListener('pointerdown', function (e) { drueckt = true; zuletzt = null; var p = punkt(e); malen(p[0], p[1]); });
flaeche.addEventListener('pointermove', function (e) { if (drueckt) { var p = punkt(e); malen(p[0], p[1]); } });
addEventListener('pointerup', function () { drueckt = false; });

function topfSvg(c) { return '<svg viewBox="0 0 64 64"><path d="M14 24 L17 50 Q32 57 47 50 L50 24 Z" fill="#8a6a44" stroke="#3a2614" stroke-width="1.8"/><path d="M16 32 Q32 37 48 32" fill="none" stroke="#6b4e30" stroke-width="1.4"/>' +
  '<ellipse cx="32" cy="24" rx="18" ry="6.5" fill="' + c + '" stroke="#3a2614" stroke-width="1.8"/><ellipse cx="27" cy="22.5" rx="6" ry="1.8" fill="rgba(255,255,255,.3)"/></svg>'; }
function pinsel(c) { var s = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><path d="M38 2 L22 18" stroke="#7A5230" stroke-width="5" stroke-linecap="round"/><path d="M24 16 L18 22" stroke="#B8B2A7" stroke-width="7"/><path d="M19 21 Q13 21 8 28 Q4 34 2 38 Q6 36 12 32 Q19 27 19 21 Z" fill="' + c + '" stroke="#2a1a0c" stroke-width="1.2"/></svg>';
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(s) + '") 2 38, crosshair'; }
var knoepfe = [];
function toepfeBauen() {
  knoepfe.forEach(function (b) { b.remove(); }); knoepfe = []; var aussen = document.getElementById('aussen');
  TOEPFE.forEach(function (t, i) { var w = -Math.PI / 2 + i * 2 * Math.PI / Math.max(TOEPFE.length, 6), rad = 45;
    var b = document.createElement('button'); b.className = 'topf'; b.type = 'button'; b.title = t.name; b.style.left = (50 + rad * Math.cos(w)) + '%'; b.style.top = (50 + rad * Math.sin(w)) + '%';
    b.onclick = function () { if (rest(t) <= 0) { leer(t); return; } farbe = t; flaeche.style.cursor = pinsel(t.hex); toepfeZeigen(); };
    b.t = t; knoepfe.push(b); aussen.appendChild(b); });
  farbe = TOEPFE.filter(function (t) { return rest(t) > 0; })[0] || null; if (farbe) flaeche.style.cursor = pinsel(farbe.hex); toepfeZeigen();
  if (!TOEPFE.length) document.getElementById('hinweis').textContent = 'Du hast noch keine Farbe. Reib erst am Reibstein ein Töpfchen.';
}
function toepfeZeigen() { knoepfe.forEach(function (b) { var r = rest(b.t); b.innerHTML = topfSvg(b.t.hex) + '<b>' + r + '</b>'; b.disabled = r <= 0; b.setAttribute('aria-pressed', String(farbe === b.t)); b.title = b.t.name + ' · noch ' + r + ' Felder'; }); }
function an(id, m) { document.getElementById('m_einzeln').setAttribute('aria-pressed', String(m === 'einzeln')); document.getElementById('m_kreis').setAttribute('aria-pressed', String(m === 'kreis')); modus = m; }
document.getElementById('m_einzeln').onclick = function () { an(0, 'einzeln'); };
document.getElementById('m_kreis').onclick = function () { an(0, 'kreis'); };
document.getElementById('neu').onclick = function () { seed = (seed * 7 + 13) % 100000 + 1; bauen(); };   // nichts verbraucht, solange nichts an der Wand hängt
function zumSpiel(d) { try { (window.parent !== window ? window.parent : window.opener).postMessage(d, '*'); } catch (e) {} }
document.getElementById('weg').onclick = function () { zumSpiel({ wzf: 'malbrett_zu' }); };
document.getElementById('fertig').onclick = function () {
  if (!Object.keys(feldFarbe).length) { document.getElementById('hinweis').textContent = 'Noch ist kein Feld bemalt.'; return; }
  var c = document.createElement('canvas'), G = 384; c.width = c.height = G; var g = c.getContext('2d');
  g.fillStyle = '#6b4a2a'; g.fillRect(0, 0, G, G); g.drawImage(cF, 0, 0, G, G); g.drawImage(cL, 0, 0, G, G);
  var toepfe = {}; Object.keys(verbraucht).forEach(function (id) { toepfe[id] = Math.ceil(verbraucht[id] / JE_TOPF); });   // angebrochene Töpfchen sind verbraucht (die Farbe trocknet)
  zumSpiel({ wzf: 'rosette', bild: c.toDataURL('image/jpeg', 0.86), toepfe: toepfe, felder: Object.keys(feldFarbe).length });
};
addEventListener('message', function (e) { var d = e.data; if (!d || d.wzf !== 'malbrett') return; TOEPFE = d.toepfe || []; JE_TOPF = d.jeTopf || JE_TOPF; document.getElementById('jeTopf').textContent = JE_TOPF; leeren(); toepfeBauen(); });
addEventListener('keydown', function (e) { if (e.key === 'Escape') zumSpiel({ wzf: 'malbrett_zu' }); });
bauen(); toepfeBauen(); zumSpiel({ wzf: 'malbrett_bereit' });
</script>
</body>
</html>
