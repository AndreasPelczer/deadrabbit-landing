<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAS DORF</title>
<style>
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f1eee4; font-family: system-ui, sans-serif; }
  main { width: 100%; max-width: 960px; }
  #kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0; font-size: 15px; }
  canvas { touch-action: none; width: 100%; display: block; aspect-ratio: 4 / 3; background: #10131b; border: 2px solid #f1eee4; image-rendering: pixelated; }
  .hilfe { opacity: .7; }
  @media (max-width: 700px) and (orientation: portrait) { body { padding-inline: 4px; } .hilfe { display: none; } canvas { border-width: 1px; } }
  @media (orientation: landscape) and (max-height: 700px) {
    body { padding: 0; min-height: 100vh; min-height: 100dvh; } main { width: auto; max-width: none; } #kopf { display: none; }
    canvas { border: 0; width: calc(100vh * 4 / 3); width: min(calc(100dvh * 4 / 3), 100vw); height: auto; }
  }
</style>
</head>
<body>
<main>
  <div id="kopf">
    <strong>DAS DORF – KAPITEL 1: DIE BACH</strong>
    <span class="hilfe">Pfeile/Stick: wählen und Leute verteilen · Leertaste/Knopf: weiter · oder antippen</span>
  </div>
  <canvas id="spiel" width="640" height="480"></canvas>
</main>
<script>
(function () {
  'use strict';
  var c = document.getElementById('spiel'), x = c.getContext('2d');
  var W = 320, H = 240;
  var COL = { nacht: '#10131b', hell: '#f1eee4', grau: '#7b7f88', feuer: '#ffd25a', rot: '#e2553a', gruen: '#7fd06a', blau: '#5fb4ff', braun: '#8a5a2b', rosa: '#ff4fa3', dunkel: '#1c2230' };

  // ---------- Einstellbar (alles fachliche hier oben) ----------
  var KARTE_B = 24, KARTE_H = 18, KACHEL = 16, SICHT_B = 13, SICHT_H = 11;
  var JAHRESZEITEN = ['FRÜHLING', 'SOMMER', 'HERBST', 'WINTER'];
  var ESSEN = [1, 1, 1, 2];                      // Nahrung pro Kopf je Jahreszeit (im Winter doppelt)
  var HOLZ_WINTER = 4;                           // Holz pro Langhaus im Winter
  var PLATZ_HAUS = 6;                            // Leute pro Langhaus
  var HAUS_HOLZ = 10, HAUS_ARBEIT = 4;           // ein neues Langhaus: Holz und Arbeitsjahreszeiten
  var ERNTE_FELD = 6;                            // Nahrung pro reifem Feld
  var ZIEL_VERTRAUEN = 100, ZIEL_EHEN = 2, ZIEL_LEUTE = 10;
  var VORNAMEN_M = ['ARN', 'KALO', 'TIBO', 'BRAN', 'ODO', 'URK', 'LEIF', 'HAGO', 'RUNO', 'MATT', 'ESK', 'TORM'];
  var VORNAMEN_W = ['ULA', 'MIRA', 'RANA', 'EIBE', 'SELA', 'OTTA', 'LIVA', 'BIRKA', 'NELA', 'WALA', 'IRMA', 'HEDA'];
  var SIPPE_M = ['GORM', 'BALD', 'TEUT', 'WIGO', 'ALBO', 'GERO', 'HUNO', 'DAGO'], SIPPE_W = ['ALMA', 'FRIGA', 'SUNNA', 'HILDA', 'GUDA', 'ERNA', 'WIBKE', 'ODA'];
  var FREMDE_M = ['HAGO', 'RUNO', 'ESK', 'BORIN', 'WALT', 'KUNO'], FREMDE_W = ['OTTA', 'LIVA', 'RIKE', 'GESA', 'TALA', 'ISA'];
  // So redet die Sippe drüben – Andreas' Sachsenhäuserisch, wörtlich, nichts dazuerfunden
  var MUNDART = ['NOB DIE BOCH!', 'GEMMAL HODDI NOHB DIE BOACH UND BRINGHOL WOASSA.'];

  // ---------- Aufgaben ----------
  var AUFGABEN = [
    { id: 'feld',    name: 'FELD',      text: 'Frühling säen, Herbst ernten' },
    { id: 'sammeln', name: 'JAGEN',     text: 'Jagen und Sammeln: Nahrung' },
    { id: 'holz',    name: 'HOLZ',      text: 'Holz schlagen für den Winter' },
    { id: 'roden',   name: 'RODEN',     text: 'Wald zu Wiese machen' },
    { id: 'bauen',   name: 'BAUEN',     text: 'ein neues Langhaus' },
    { id: 'wache',   name: 'WACHE',     text: 'gegen Wölfe und Bären' },
    { id: 'erkunden',name: 'ERKUNDEN',  text: 'die Karte wird größer' },
    { id: 'sippe',   name: 'SIPPE',     text: 'die Sippe am anderen Ufer besuchen' }
  ];

  // ---------- Karte ----------
  // W Wald · G Wiese · B die Bach (Teilbach) · F Feld · H Langhaus · S Sippe · Q Quelle · R Fels · M der große Fluss (die Tauber – in sie fließt die Bach, sie selbst in den Main)
  var karte, sicht, felder;
  function karteBauen() {
    karte = []; sicht = [];
    for (var y = 0; y < KARTE_H; y++) { karte.push([]); sicht.push([]); for (var xx = 0; xx < KARTE_B; xx++) { karte[y].push('W'); sicht[y].push(false); } }
    var vorX = null;
    for (var y2 = KARTE_H - 1; y2 >= 0; y2--) {                                 // die Bach schlängelt sich von Süden nach Norden, ohne Lücke
      var bx = Math.round(12 + Math.sin(y2 / 2.6) * 1.6);
      if (vorX !== null) for (var zx = Math.min(vorX, bx); zx <= Math.max(vorX, bx); zx++) karte[y2][zx] = 'B';
      karte[y2][bx] = 'B'; vorX = bx;
    }
    for (var mx = 0; mx < KARTE_B; mx++) { karte[0][mx] = 'M'; karte[1][mx] = mx % 5 === 0 ? 'G' : 'M'; }   // ganz im Norden der Main
    for (var dy = -2; dy <= 2; dy++) for (var dx = -3; dx <= 3; dx++) {          // die sonnige Mulde
      var yy = 9 + dy, xq = 12 + dx; if (karte[yy][xq] !== 'B' && Math.abs(dx) + Math.abs(dy) < 5) karte[yy][xq] = 'G';
    }
    karte[9][9] = 'H';                                                           // unser Langhaus
    karte[8][15] = 'S'; karte[10][16] = 'S';                                     // die Sippe drüben
    karte[4][6] = 'Q'; karte[14][19] = 'R'; karte[3][20] = 'R'; karte[15][4] = 'Q';
    for (var r = 0; r < 26; r++) { var ry = 2 + Math.floor(Math.random() * (KARTE_H - 3)), rx = Math.floor(Math.random() * KARTE_B); if (karte[ry][rx] === 'W' && Math.random() < .5) karte[ry][rx] = 'G'; }
    for (var sy = 5; sy <= 13; sy++) for (var sx = 7; sx <= 17; sx++) sicht[sy][sx] = true;   // was man anfangs sieht
    felder = {};                                                                 // "y,x" -> 'leer' | 'gesaet' | 'reif'
  }
  function nachbarn(y, xx) { return [[y - 1, xx], [y + 1, xx], [y, xx - 1], [y, xx + 1]].filter(function (p) { return p[0] >= 0 && p[1] >= 0 && p[0] < KARTE_H && p[1] < KARTE_B; }); }
  function abstandZumHaus(y, xx) { return Math.abs(y - 9) + Math.abs(xx - 9); }
  function kacheln(typ) { var l = []; for (var y = 0; y < KARTE_H; y++) for (var xx = 0; xx < KARTE_B; xx++) if (karte[y][xx] === typ && sicht[y][xx]) l.push([y, xx]); return l; }
  function abseitsHaus(q) {                                                    // das gemalte Langhaus ist breiter als eine Kachel
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { var y = q[0] + dy, xx = q[1] + dx; if (y >= 0 && xx >= 0 && y < KARTE_H && xx < KARTE_B && karte[y][xx] === 'H') return false; }
    return true;
  }
  function westlich(p) { return p[1] < karte[p[0]].indexOf('B'); }            // unsere Seite: links von der Bach in dieser Zeile

  // ---------- Zustand ----------
  var s = null, modus = 'titel', seit = 0, zeit = 0, wahl = 0;
  function person(name, alter, w, herkunft) { return { name: name, alter: alter, w: w, partner: null, herkunft: herkunft || 'wir', lebt: true }; }
  function neuesSpiel() {
    karteBauen();
    var arn = person('ARN', 28, false), ula = person('ULA', 25, true);
    arn.partner = ula; ula.partner = arn;
    s = { jahr: 1, jz: 0, leute: [arn, ula, person('KALO', 19, false), person('TIBO', 9, false), person('MIRA', 5, true)],
          nahrung: 22, holz: 8, saat: 6, vertrauen: 10, haeuser: 1, bauFortschritt: 0, ehen: 0,
          plan: { feld: 2, sammeln: 1, holz: 0, roden: 0, bauen: 0, wache: 0, erkunden: 0, sippe: 0 },
          bericht: [], chronik: ['JAHR 1: ARN UND ULA KOMMEN MIT IHRER FAMILIE AN DEN BACH.'], frage: null, ende: null, namenM: VORNAMEN_M.slice(4), namenW: VORNAMEN_W.slice(2) };
    s.arbeiterNamen = arbeiter().map(function (p) { return p.name; });
    setze('planen'); speichern();
  }
  var SPEICHER = 'dasdorf-kapitel1';
  function speichern() {
    try {
      var leute = s.leute, kopie = JSON.stringify(s, function (k, v) { return k === 'partner' ? (v ? leute.indexOf(v) : -1) : (k === 'frage' || k === 'hochzeit') ? null : v; });
      localStorage.setItem(SPEICHER, JSON.stringify({ s: JSON.parse(kopie), karte: karte, sicht: sicht, felder: felder }));
    } catch (e) {}
  }
  function gespeichert() { try { var d = JSON.parse(localStorage.getItem(SPEICHER)); return d && d.s && !d.s.ende ? d : null; } catch (e) { return null; } }
  function laden() {
    var d = gespeichert(); if (!d) return false;
    s = d.s; karte = d.karte; sicht = d.sicht; felder = d.felder;
    s.leute.forEach(function (p) { p.partner = p.partner >= 0 ? s.leute[p.partner] : null; });
    s.szenen = []; figurenSchluessel = ''; setze('planen'); return true;
  }
  function vergessen() { try { localStorage.removeItem(SPEICHER); } catch (e) {} }
  function setze(m) { modus = m; seit = zeit; wahl = 0; }
  function lebende() { return s.leute.filter(function (p) { return p.lebt; }); }
  function arbeiter() { return lebende().filter(function (p) { return p.alter >= 13 && p.alter <= 60; }); }
  function verplant() { var n = 0; for (var k in s.plan) n += s.plan[k]; return n; }
  function frei() { return arbeiter().length - verplant(); }
  function chronik(t) { s.chronik.push('JAHR ' + s.jahr + ': ' + t); }
  function vergeben(n) { return s.leute.some(function (p) { return p.name === n; }); }
  function freierName(liste, ersatz) { for (var i = 0; i < liste.length; i++) if (!vergeben(liste[i])) return liste[i]; return ersatz + ' ' + (s.leute.length + 1); }
  function neuerName(w) { var l = w ? s.namenW : s.namenM; while (l.length && vergeben(l[0])) l.shift(); return l.length ? l.shift() : freierName(w ? VORNAMEN_W : VORNAMEN_M, w ? 'KLEINE' : 'KLEINER'); }
  // Die Neuen sagen „der Bach“. Erst seit der ersten Hochzeit mit der Sippe heißt es auch bei ihnen „die Bach“ – wie drüben.
  function bach(fall) {
    var die = s && s.ehen > 0;
    return ({ nom: die ? 'DIE BACH' : 'DER BACH', akk: die ? 'DIE BACH' : 'DEN BACH', dat: die ? 'DER BACH' : 'DEM BACH',
              an: die ? 'AN DER BACH' : 'AM BACH', anAkk: die ? 'AN DIE BACH' : 'AN DEN BACH', ueber: die ? 'ÜBER DIE BACH' : 'ÜBER DEN BACH' })[fall || 'nom'];
  }
  function zufall(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ---------- Eine Jahreszeit ausführen ----------
  function jahreszeitBeenden() {
    var b = [], p = s.plan, jz = s.jz, faktor = 1; s.szenen = [];
    // Ereignis zuerst würfeln – manche wirken auf die Ernte
    var ev = ereignisWuerfeln(jz);
    if (ev && ev.faktor) faktor = ev.faktor;
    // Feld
    if (p.feld) {
      var fk = Object.keys(felder);
      if (jz === 0) {                                                            // säen
        var gesaet = 0;
        fk.forEach(function (k) { if (felder[k] === 'leer' && gesaet < p.feld && s.saat > 0) { felder[k] = 'gesaet'; s.saat--; gesaet++; } });
        b.push(gesaet ? gesaet + ' FELD' + (gesaet > 1 ? 'ER' : '') + ' GESÄT.' : (fk.length ? 'KEIN SAATGUT ODER KEIN FREIES FELD.' : 'NOCH KEIN FELD – ERST RODEN, DANN WIRD WIESE ZU FELD.'));
        // freie Wiese neben dem Haus wird zum Feld, wenn Leute übrig sind
        var neu = Math.max(0, p.feld - gesaet);
        kacheln('G').filter(westlich).filter(abseitsHaus).sort(function (a2, b2) { return abstandZumHaus(a2[0], a2[1]) - abstandZumHaus(b2[0], b2[1]); }).slice(0, neu).forEach(function (q) {
          if (s.saat > 0) { karte[q[0]][q[1]] = 'F'; felder[q[0] + ',' + q[1]] = 'gesaet'; s.saat--; b.push('NEUES FELD ANGELEGT UND GESÄT.'); }
        });
      } else if (jz === 2) {                                                     // ernten
        var reif = fk.filter(function (k) { return felder[k] === 'reif'; }), geerntet = Math.min(reif.length, p.feld * 2);
        var ertrag = Math.round(geerntet * ERNTE_FELD * faktor);
        reif.slice(0, geerntet).forEach(function (k) { felder[k] = 'leer'; });
        s.nahrung += ertrag; s.saat += geerntet + Math.floor(geerntet / 2);
        b.push(geerntet ? 'ERNTE: ' + geerntet + ' FELDER, +' + ertrag + ' NAHRUNG, +' + (geerntet + Math.floor(geerntet / 2)) + ' SAATGUT.' : 'NICHTS ZU ERNTEN.');
      } else if (jz === 1) { var n2 = p.feld * 2; s.nahrung += n2; b.push('DIE BAUERN JÄTEN UND SAMMELN DABEI BEEREN: +' + n2 + ' NAHRUNG.'); }
      else { var h2 = p.feld * 2; s.holz += h2; b.push('IM WINTER GEHEN DIE BAUERN INS HOLZ: +' + h2 + ' HOLZ.'); }
    }
    // Felder wachsen von selbst: gesät im Frühling -> reif im Herbst
    if (jz === 1) Object.keys(felder).forEach(function (k) { if (felder[k] === 'gesaet') felder[k] = 'reif'; });
    // Jagen und Sammeln
    if (p.sammeln) { var n = Math.round(p.sammeln * [2, 3, 3, 1][jz] * (ev && ev.wild ? ev.wild : 1)); s.nahrung += n; b.push('JAGEN UND SAMMELN: +' + n + ' NAHRUNG.'); }
    // Holz
    if (p.holz) { var h = p.holz * 3; s.holz += h; b.push('HOLZ: +' + h + '.'); }
    // Roden
    if (p.roden) {
      var wald = []; kacheln('W').filter(westlich).forEach(function (q) { if (nachbarn(q[0], q[1]).some(function (nb) { var t = karte[nb[0]][nb[1]]; return t === 'G' || t === 'F' || t === 'H'; })) wald.push(q); });
      wald.sort(function (a2, b2) { return abstandZumHaus(a2[0], a2[1]) - abstandZumHaus(b2[0], b2[1]); });
      var gerodet = Math.min(wald.length, Math.ceil(p.roden / 2) + (jz === 3 ? 0 : Math.floor(p.roden / 2)));
      wald.slice(0, gerodet).forEach(function (q) { karte[q[0]][q[1]] = 'G'; });
      s.holz += gerodet * 2; b.push(gerodet ? gerodet + ' STÜCK WALD GERODET, +' + gerodet * 2 + ' HOLZ.' : 'KEIN WALD MEHR ZUM RODEN IN DER NÄHE.');
    }
    // Bauen
    if (p.bauen && s.bauFortschritt === 0 && lebende().length < s.haeuser * PLATZ_HAUS - 1) {
      var h4 = p.bauen * 3; s.holz += h4; b.push('NOCH IST PLATZ IM LANGHAUS. DIE BAULEUTE SCHLAGEN HOLZ: +' + h4 + '.');
    } else if (p.bauen) {
      if (s.holz >= HAUS_HOLZ || s.bauFortschritt > 0) {
        if (s.bauFortschritt === 0) s.holz -= HAUS_HOLZ;
        s.bauFortschritt += p.bauen;
        if (s.bauFortschritt >= HAUS_ARBEIT) {
          s.bauFortschritt = 0; s.haeuser++;
          var platz = kacheln('G').filter(westlich).filter(abseitsHaus).sort(function (a2, b2) { return abstandZumHaus(a2[0], a2[1]) - abstandZumHaus(b2[0], b2[1]); })[0];
          if (platz) karte[platz[0]][platz[1]] = 'H';
          b.push('EIN NEUES LANGHAUS STEHT! PLATZ FÜR ' + s.haeuser * PLATZ_HAUS + '.'); chronik('EIN NEUES LANGHAUS WIRD GEBAUT.');
        } else b.push('AM LANGHAUS WIRD GEBAUT (' + s.bauFortschritt + '/' + HAUS_ARBEIT + ').');
      } else { var h3 = p.bauen * 3; s.holz += h3; b.push('ZU WENIG HOLZ FÜR EIN LANGHAUS (' + HAUS_HOLZ + ' NÖTIG). DIE BAULEUTE SCHLAGEN HOLZ: +' + h3 + '.'); }
    }
    // Erkunden
    if (p.erkunden) {
      var neuGesehen = 0, fund = null;
      for (var e = 0; e < p.erkunden * 7; e++) {
        var rand = []; for (var y = 0; y < KARTE_H; y++) for (var xx = 0; xx < KARTE_B; xx++) if (!sicht[y][xx] && nachbarn(y, xx).some(function (nb) { return sicht[nb[0]][nb[1]]; })) rand.push([y, xx]);
        if (!rand.length) break;
        var q2 = zufall(rand); sicht[q2[0]][q2[1]] = true; neuGesehen++;
        var t2 = karte[q2[0]][q2[1]]; if (t2 === 'Q' || t2 === 'M' || t2 === 'R') fund = t2;
      }
      b.push('ERKUNDET: ' + neuGesehen + ' NEUE FLECKEN.' + (fund === 'Q' ? ' EINE QUELLE!' : fund === 'M' ? ' DER GROSSE FLUSS IM NORDEN!' : fund === 'R' ? ' FELSEN MIT FEUERSTEIN!' : ''));
      if (fund === 'Q') s.nahrung += 3; if (fund === 'R') s.holz += 0;
      if (fund === 'M' && !s.mainGesehen) { s.mainGesehen = true; chronik('DIE KUNDSCHAFTER SEHEN ZUM ERSTEN MAL DEN GROSSEN FLUSS.'); }
    }
    // Sippe besuchen
    if (p.sippe) { var v = p.sippe * 5; s.vertrauen = Math.min(ZIEL_VERTRAUEN, s.vertrauen + v); b.push('BESUCH BEI DER SIPPE: VERTRAUEN +' + v + '.'); if (s.vertrauen >= 30) b.push('DRÜBEN RUFT EINE: „' + zufall(MUNDART) + '“'); }
    // Ereignis auswerten
    if (ev) ev.wirkung(b);
    if (s.hochzeit) { s.hochzeit.wirkung(b); s.hochzeit = null; }
    // Essen
    var lebend = lebende(), bedarf = lebend.length * ESSEN[jz];
    s.nahrung -= bedarf; b.push('GEGESSEN: ' + bedarf + ' NAHRUNG.');
    if (s.nahrung < 0) {
      s.hunger = (s.hunger || 0) + 1;
      if (s.hunger >= 2 || s.nahrung < -lebend.length) verhungern(b); else b.push('🟠 DIE VORRÄTE REICHEN NICHT. ALLE HUNGERN. NOCH EINMAL SO, UND JEMAND STIRBT.');
      s.nahrung = 0;
    } else s.hunger = 0;
    // Winter: Holz und Älterwerden
    if (jz === 3) {
      var holzBedarf = s.haeuser * HOLZ_WINTER * (s.strengerWinter ? 2 : 1); s.strengerWinter = false;
      s.holz -= holzBedarf; b.push('GEHEIZT: ' + holzBedarf + ' HOLZ.');
      if (s.holz < -2) { s.holz = 0; frieren(b); }
      else if (s.holz < 0) { s.holz = 0; b.push('🟠 DAS HOLZ REICHT KNAPP NICHT. ALLE FRIEREN, ABER ALLE ÜBERLEBEN.'); }
      winterEnde(b);
    }
    anpassen(b); s.bericht = b;                                                 // feste Berufe: jeder bleibt bei seiner Arbeit
    pruefeEnde();
    setze(s.szenen.length ? 'szene' : 'bericht');
  }
  function verhungern(b) {
    var opfer = lebende().sort(function (a2, b2) { return Math.abs(a2.alter - 25) < Math.abs(b2.alter - 25) ? 1 : -1; })[0];   // die Schwächsten zuerst
    if (opfer) { opfer.lebt = false; b.push('🔴 DIE VORRÄTE REICHEN NICHT. ' + opfer.name + ' VERHUNGERT.'); chronik(opfer.name + ' VERHUNGERT IM ' + JAHRESZEITEN[s.jz] + '.'); witwe(opfer); }
  }
  function frieren(b) {
    var alte = lebende().filter(function (p) { return p.alter > 45 || p.alter < 4; });
    var opfer = alte.length ? zufall(alte) : (Math.random() < .5 ? zufall(lebende()) : null);
    if (opfer) { opfer.lebt = false; b.push('🔴 ZU WENIG HOLZ. ' + opfer.name + ' ERFRIERT.'); chronik(opfer.name + ' ERFRIERT IM WINTER.'); witwe(opfer); }
    else b.push('ZU WENIG HOLZ – ALLE FRIEREN, ABER ÜBERLEBEN.');
  }
  function witwe(p) { if (p.partner) { p.partner.partner = null; p.partner = null; } }
  function winterEnde(b) {
    lebende().forEach(function (p) {
      p.alter++;
      if (p.alter > 40 && Math.random() < (p.alter - 40) * .02) { p.lebt = false; b.push(p.name + ' STIRBT MIT ' + p.alter + ' JAHREN.'); chronik(p.name + ' STIRBT ALT UND SATT, MIT ' + p.alter + ' JAHREN.'); witwe(p); }
    });
    // Kinder
    lebende().forEach(function (p) {
      if (p.w && p.partner && p.partner.lebt && p.alter >= 16 && p.alter <= 38 && lebende().length < s.haeuser * PLATZ_HAUS && s.nahrung > 4 && Math.random() < .45) {

    if (t > 2500 && Math.floor(zeit / 500) % 2) text('KNOPF = LOS', 160, 222, 8, COL.feuer, 'center');
  }
  function endeMalen() {
    x.fillStyle = s.ende === 'dorf' ? '#132018' : '#1a0e10'; x.fillRect(0, 0, W, H);
    text(s.ende === 'dorf' ? 'AN DER BACH IST EIN DORF ENTSTANDEN' : 'DIE MULDE ' + bach('an') + ' IST WIEDER LEER', 160, 18, 9, s.ende === 'dorf' ? COL.gruen : COL.rot, 'center');

    zeilen.slice(-18).forEach(function (z, i) { text(z, 12, 58 + i * 8.6, 6, COL.hell); });
    if (zeit - seit > 1500 && Math.floor(zeit / 500) % 2) text(s.ende === 'dorf' ? 'KNOPF = WEITER ZU KAPITEL 2: DIE BURG AM MAIN' : 'KNOPF = NOCHMAL', 160, 232, 8, COL.feuer, 'center');
  }
  function zeichnen() {
    x.setTransform(2, 0, 0, 2, 0, 0);                                            // intern doppelt so fein, gerechnet wird in 320×240
    x.imageSmoothingEnabled = false;
    if (modus === 'titel') return titelMalen();

  }
  function tick(jetzt) { zeit = jetzt; schritt(lesen()); zeichnen(); requestAnimationFrame(tick); }
  window.__dorf = function () { return { s: s, modus: modus, wahl: wahl, karte: karte, sicht: sicht, felder: felder, jahreszeitBeenden: jahreszeitBeenden, neuesSpiel: neuesSpiel }; };   // nur zum Testen
