<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUMPFWURM</title>
<style>
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f1eee4; font-family: system-ui, sans-serif; }
  main { width: 100%; max-width: 960px; }
  #kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0; font-size: 15px; }
  canvas { cursor: none; touch-action: none; width: 100%; display: block; aspect-ratio: 4 / 3; background: #10131b; border: 2px solid #f1eee4; image-rendering: pixelated; }
  .hilfe { opacity: .7; }
  /* Handy hochkant: kein Rand verschenken, die Tasten-Hilfe braucht dort keiner */
  @media (max-width: 700px) and (orientation: portrait) {
    body { padding-inline: 4px; }
    .hilfe { display: none; }
    canvas { border-width: 1px; }
  }
  /* Handy quer: das Spielfeld so gross wie der Bildschirm hoch ist, nichts abgeschnitten */
  @media (orientation: landscape) and (max-height: 700px) {
    body { padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); min-height: 100vh; min-height: 100dvh; }
    main { width: auto; max-width: none; }
    #kopf { display: none; }
    canvas { border: 0; width: calc(100vh * 4 / 3); width: min(calc(100dvh * 4 / 3), calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); height: auto; }
  }
</style>
</head>
<body>
<main>
  <div id="kopf">
    <strong>SUMPFWURM – DIE BRAUNE SUMPFWURM-INVASION</strong>
    <span class="hilfe">Stick/Pfeile: laufen · Leertaste/A halten: Tüten · R/B: nachdrehen · Finger halten: laufen + feuern · Esc: Menü</span>
  </div>
  <canvas id="spiel" width="320" height="240"></canvas>
</main>
<script src="../gemeinsam/arcade.js"></script>
<script>
(function () {
  'use strict';
  var A = ARCADE, W = A.W, H = A.H, COL = A.COL, x = null;

  // ---------- Einstellbar ----------
  var Z = 8, SPALTEN = 40, ZEILEN = 26, OBEN = 12;            // Raster 40×26 Felder à 8 px, ab y=12
  var ZONE = 20;                                              // ab dieser Zeile darf man laufen
  var BODEN_Y = OBEN + ZEILEN * Z;                            // 220
  var LEBEN = 3, EXTRA_LEBEN_BEI = 8000;
  var WURM_LAENGE = 11, TAKT_MS = 70, TAKT_WELLE = 0.09, TAKT_MIN_MS = 34, EXTRA_KOEPFE_AB = 3, EXTRA_KOEPFE_MAX = 5;
  var PILZE_START = 36, PILZ_LEBEN = 4, PILZE_NEU_PRO_WELLE = 4;
  var SPIELER_T = 0.13, SP_B = 6, SP_H = 10, SPIELER_TEMPO = 95, FINGER_TEMPO = 150, FINGER_ABSTAND = 18;
  var TUETE_TEMPO = 380, MAGAZIN = 15, NACHDREHEN_MS = 900, SCHUSS_PAUSE_MS = 60;
  var PUNKTE_KOPF = 100, PUNKTE_LEIB = 10, PUNKTE_PILZ = 1, PUNKTE_TABLETTE = 200, PUNKTE_HEIL = 5, SCHABE_PUNKTE = [900, 600, 300];
  var TABLETTE_AB_WELLE = 2, TABLETTE_WENN_UNTER = 5, TABLETTE_CHANCE = 0.012, TABLETTE_TEMPO = 110, TABLETTE_PILZ = 0.22;
  var SCHABE_ALLE_MS = 7500, SCHABE_TEMPO = 62;
  var STERNE_MAX = 2, STERN_MS = 800;
  var TREFFER_MS = 1900, WELLE_MS = 2000, TITEL_WECHSEL_MS = 4500;
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var LISTE = A.liste('sumpf-wurm');
  var ZURUECK = '../index.html';

  // ---------- Bilder (alles Pixel, keine Dateien) ----------
  var ZAUBER = ['#d02a8a', '#7a3ad0', '#2a9ad0', '#e2742a', '#3ab06a', '#c8302a', '#d0b02a', '#e05ac0'];   // Hutfarbe je Welle
  var PILZ = ['..ccc..', '.cwcccc', 'cccccwc', 'cwccccc', '..sss..', '..sss..', '.sssss.'];
  var PILZ_ZEILEN = [0, 3, 4, 6, 7];                                                                     // zerschossen = kleiner
  var LEIB = ['..bbb..', '.bhbbb.', 'bhbbbbb', 'bbbbbbb', 'bbbbbRb', '.bbbRb.', '..bbb..'];
  var WURM_PAL = { b: '#7a4a22', h: '#a8703a', R: '#5a3412' };
  var FIGUR = [['kumpel', 'kumpel'], ['wanderer', 'wanderer'], ['sprinter', 'sprinter'], ['sani', 'sani']];

  var WELLEN = ['DER SUMPFWURM KOMMT!', 'ER HAT ZAUBERPILZE GEGESSEN', 'JETZT MIT MEHR KÖPFEN', 'BRAUN. LANG. SCHLECHT GELAUNT.',
                'DER SUMPF BRODELT', 'DOC: DAS IST NICHT NORMAL', 'TABLETTEN-REGEN', 'DIE GANZE BRUT'];
  var KOPF_WOERTER = ['KOPF AB!', 'MATSCH!', 'PLOPP!', 'SCHLEIM!', 'ŞEREFE!', '¡OLÉ!', 'ASLANIM!'];
  var WITZE = ['DER FRÜHE WURM WIRD VON DER TÜTE ERWISCHT.', 'EIN WURM IN ZWEI HÄLFTEN SIND ZWEI WÜRMER. MATHE IM SUMPF.',
               'DOC SAGT: NICHT ALLES, WAS IM SUMPF WÄCHST, IST SALAT.', 'DER WURM WOLLTE IN DIE KARTOFFEL. DIE KARTOFFEL WAR SCHNELLER.',
               'WER ZAUBERPILZE ISST, SIEHT DEN WURM DOPPELT. DER WURM AUCH.'];
  var LAUFTEXT = '+++ DIE BRAUNE SUMPFWURM-INVASION +++ KOPF TREFFEN GIBT 100 – SONST SIND ES HALT ZWEI WÜRMER +++ ZAUBERPILZE NICHT ESSEN, NUR ABSCHIESSEN +++ TABLETTEN FALLEN VOM HIMMEL – DOC WEISS VON NICHTS +++ DIE SCHABE KOMMT AUS DER KÜCHE +++ TÜTE LEER? NACHDREHEN! +++ DER WURM IST BRAUN, DER SUMPF AUCH, ZUFALL? +++ WERDÖ A MOH +++ ';

  // ---------- Zustand ----------
  var modus = 'titel', seit = 0, uhr = 0, name = [0, 11, 5], namePos = 0, platz = -1, endeWahl = 0, s = null;

  function setzeModus(m) { modus = m; seit = uhr; }
  function mischen(l) { l = l.slice(); for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = l[i]; l[i] = l[j]; l[j] = t; } return l; }
  function zufall(n) { return Math.floor(Math.random() * n); }

  // Pilze liegen in einem Raster: 0 = frei, 1..4 = so viel hält er noch aus
  function pilz(c, r) { return c < 0 || r < 0 || c >= SPALTEN || r >= ZEILEN ? 0 : s.pilze[r * SPALTEN + c]; }
  function pilzSetzen(c, r, hp) { if (c >= 0 && r >= 0 && c < SPALTEN && r < ZEILEN) s.pilze[r * SPALTEN + c] = hp; }
  function pilzeIn(von, bis) { var n = 0; for (var r = von; r < bis; r++) for (var c = 0; c < SPALTEN; c++) if (pilz(c, r)) n++; return n; }
  function pilzeStreuen(n) {
    for (var i = 0; i < n; i++) {
      var c = zufall(SPALTEN), r = 1 + zufall(ZEILEN - 2);
      if (r >= ZONE && Math.random() < .6) r = 1 + zufall(ZONE - 1);           // unten nur wenige
      if (!pilz(c, r)) pilzSetzen(c, r, PILZ_LEBEN);
    }
  }

  function neuesSpiel() {
    var leute = mischen(A.TRUPPE).slice(0, LEBEN);
    s = { punkte: 0, welle: 0, leben: LEBEN, leute: leute, wer: 0, treffer: 0, verschossen: 0, segmente: 0,
          sx: W / 2, sy: BODEN_Y - 2, phase: 0, munition: MAGAZIN, nachdrehenBis: 0, schussPause: 0, tuete: null,
          pilze: [], wuermer: [], takt: 0, tablette: null, schabe: null, schabeUhr: 0,
          splitter: [], sterne: [], meldung: null, extra: false, grund: '' };
    for (var i = 0; i < SPALTEN * ZEILEN; i++) s.pilze.push(0);
    pilzeStreuen(PILZE_START);
    naechsteWelle();
  }

  function wurmBauen(laenge, koepfe) {
    s.wuermer = [];
    var kette = [], start = 14 + zufall(12);
    for (var i = 0; i < laenge; i++) { var c = start - i; kette.push({ c: c, r: 0, pc: c - 1, pr: 0, dx: 1, dy: 1 }); }
    s.wuermer.push(kette);
    for (var k = 0; k < koepfe; k++) {
      var kc = zufall(SPALTEN), rechts = Math.random() < .5;
      s.wuermer.push([{ c: kc, r: 0, pc: kc, pr: -1, dx: rechts ? 1 : -1, dy: 1 }]);
    }
    s.takt = 0;
  }

  function naechsteWelle() {
    s.welle++;
    var koepfe = s.welle >= EXTRA_KOEPFE_AB ? Math.min(EXTRA_KOEPFE_MAX, s.welle - EXTRA_KOEPFE_AB + 1) : 0;
    if (s.welle > 1) pilzeStreuen(PILZE_NEU_PRO_WELLE);
    wurmBauen(WURM_LAENGE - koepfe, koepfe);
    s.tuete = null; s.tablette = null; s.schabe = null; s.schabeUhr = 0;
    s.munition = MAGAZIN; s.nachdrehenBis = 0;
    setzeModus('welle');
  }

  // ---------- Hilfen ----------
  function takt() { return Math.max(TAKT_MIN_MS, TAKT_MS / (1 + TAKT_WELLE * (s.welle - 1))); }
  function segPos(g) {
    var f = Math.min(1, s.takt / takt());
    return { x: (g.pc + (g.c - g.pc) * f) * Z, y: OBEN + (g.pr + (g.r - g.pr) * f) * Z };
  }
  function ueberlapp(l1, o1, b1, h1, l2, o2, b2, h2) { return l1 < l2 + b2 && l1 + b1 > l2 && o1 < o2 + h2 && o1 + h1 > o2; }
  function wer() { return s.leute[s.wer] || 'ALF'; }
  function melden(t, farbe, ms) { s.meldung = { t: t, farbe: farbe || COL.hell, bis: uhr + (ms || 2200) }; }
  function stern(px, py, wort) {
    if (s.sterne.length >= STERNE_MAX) return false;
    s.sterne.push({ x: Math.max(30, Math.min(W - 30, px)), y: Math.max(26, Math.min(200, py)), wort: wort, start: uhr });
    return true;
  }
  function splittern(px, py, farben, n) {
    for (var i = 0; i < n; i++) s.splitter.push({ x: px, y: py, vx: (Math.random() - .5) * 90, vy: (Math.random() - .8) * 70, f: farben[i % farben.length], bis: uhr + 350 + Math.random() * 250 });
  }
  function punkte(n) {
    s.punkte += n;
    if (!s.extra && s.punkte >= EXTRA_LEBEN_BEI) {
      s.extra = true; s.leben++;
      var neu = s.leute.indexOf('AHMED') < 0 ? 'AHMED' : mischen(A.TRUPPE.filter(function (n) { return s.leute.indexOf(n) < 0; }))[0];
      s.leute.push(neu);
      melden(neu === 'AHMED' ? 'AHMED KOMMT MIT BRATWURST: +1 LEBEN' : neu + ' KOMMT DAZU: +1 LEBEN', COL.feuer, 3000);
    }
  }
  function spielerRect(px, py) { return [px - SP_B / 2, py - SP_H, SP_B, SP_H]; }
  function spielerFrei(px, py) {
    var r = spielerRect(px, py);
    for (var cy = Math.floor((r[1] - OBEN) / Z); cy <= Math.floor((r[1] + r[3] - 1 - OBEN) / Z); cy++)
      for (var cx = Math.floor(r[0] / Z); cx <= Math.floor((r[0] + r[2] - 1) / Z); cx++)
        if (pilz(cx, cy) && ueberlapp(r[0], r[1], r[2], r[3], cx * Z + 1, OBEN + cy * Z, 6, 7)) return false;
    return true;
  }
  function segmenteGesamt() { var n = 0; s.wuermer.forEach(function (k) { n += k.length; }); return n; }

  // ---------- Ablauf ----------
  function schritt(dt, e) {
    uhr += dt;
    if (modus === 'titel') { if (e.neu.a || e.klick) { name = name.slice(); namePos = 0; setzeModus('name'); } return; }
    if (modus === 'name') { nameSchritt(e); return; }
    if (modus === 'ende') {
      if (e.neu.o || e.neu.u || e.neu.l || e.neu.r) endeWahl = 1 - endeWahl;
      if (e.klick && uhr - seit > 600 && e.klick.y > 188) { endeWahl = e.klick.y < 203 ? 0 : 1; e.neu.a = true; }
      if (e.neu.a && uhr - seit > 600) { if (endeWahl === 0) neuesSpiel(); else if (typeof location !== 'undefined') location.href = ZURUECK; }
      return;
    }
    effekte(dt);
    if (modus === 'welle') {
      if (uhr - seit > WELLE_MS || ((e.neu.a || e.klick) && uhr - seit > 700)) { setzeModus('spiel'); if (s.welle === 1) melden(wer() + ' HAT DIE ZWILLE', COL.blau); }
      return;
    }
    if (modus === 'treffer') {
      if (uhr - seit > TREFFER_MS) {
        if (s.leben > 0) neuerVersuch();
        else spielEnde();
      }
      return;
    }
    if (modus === 'spiel') spielSchritt(dt, e);
  }

  function neuerVersuch() {
    // angeschossene Pilze wachsen nach (gibt ein paar Punkte), der Wurm fängt oben neu an
    var heil = 0;
    for (var i = 0; i < s.pilze.length; i++) if (s.pilze[i] && s.pilze[i] < PILZ_LEBEN) { s.pilze[i] = PILZ_LEBEN; heil++; }
    if (heil) punkte(heil * PUNKTE_HEIL);
    var koepfe = s.wuermer.length - 1, n = segmenteGesamt();
    wurmBauen(n - koepfe, koepfe);
    s.wer++; s.tuete = null; s.tablette = null; s.schabe = null; s.schabeUhr = 0;
    s.munition = MAGAZIN; s.nachdrehenBis = 0;
    s.sx = W / 2; s.sy = BODEN_Y - 2;
    var sc = Math.floor(s.sx / Z);
    for (var r = ZEILEN - 3; r < ZEILEN; r++) for (var c = sc - 1; c <= sc + 1; c++) pilzSetzen(c, r, 0);   // Platz zum Aufstehen
    melden((wer() === 'ALF' ? 'ALF ÜBERNIMMT – UNSICHTBAR' : wer() + ' ÜBERNIMMT') + (heil ? ' · PILZE +' + heil * PUNKTE_HEIL : ''), COL.blau, 2600);
    setzeModus('spiel');
  }

  function nameSchritt(e) {
    if (e.neu.o) name[namePos] = (name[namePos] + 1) % ABC.length;
    if (e.neu.u) name[namePos] = (name[namePos] + ABC.length - 1) % ABC.length;
    if (e.neu.l && namePos > 0) namePos--;
    if (e.neu.r || e.neu.a) nameWeiter();
    if (e.klick && e.klick.y > 144 && e.klick.x > 90 && e.klick.x < 230) { namePos = 0; neuesSpiel(); return; }   // FERTIG-Knopf
    if (e.klick) {
      var spalte = Math.round((e.klick.x - 130) / 30);
      if (spalte >= 0 && spalte <= 2) namePos = spalte;
      if (e.klick.y < 106) name[namePos] = (name[namePos] + 1) % ABC.length;
      else if (e.klick.y > 126) name[namePos] = (name[namePos] + ABC.length - 1) % ABC.length;
      else nameWeiter();
    }
  }
  function nameWeiter() { namePos++; if (namePos > 2) { namePos = 0; neuesSpiel(); } }

  function effekte(dt) {
    var sek = dt / 1000;
    s.splitter.forEach(function (p) { p.x += p.vx * sek; p.y += p.vy * sek; p.vy += 220 * sek; });
    s.splitter = s.splitter.filter(function (p) { return p.bis > uhr; });
    s.sterne = s.sterne.filter(function (st) { return uhr - st.start < STERN_MS; });
    if (s.meldung && s.meldung.bis < uhr) s.meldung = null;
  }

  // Jedes Glied folgt derselben Regel – darum läuft der Wurm wie einer, und zerschossen als viele.
  function gliedSchritt(g) {
    g.pc = g.c; g.pr = g.r;
    var nc = g.c + g.dx;
    if (nc < 0 || nc >= SPALTEN || (g.r >= 0 && pilz(nc, g.r))) {
      var nr = g.r + g.dy;
      if (nr >= ZEILEN) { g.dy = -1; nr = g.r - 1; }
      else if (g.dy < 0 && nr < ZONE) { g.dy = 1; nr = g.r + 1; }
      g.r = nr; g.dx = -g.dx;
    } else g.c = nc;
  }

  function spielSchritt(dt, e) {
    var sek = dt / 1000;
    // --- laufen: Stick, oder Finger halten (Figur bleibt knapp über dem Finger) ---
    var ax = 0, ay = 0, tempo = SPIELER_TEMPO, finger = e.maus && e.maus.unten;
    if (finger) {
      var zx = e.maus.x, zy = e.maus.y - FINGER_ABSTAND + SP_H, d = Math.sqrt((zx - s.sx) * (zx - s.sx) + (zy - s.sy) * (zy - s.sy));
      tempo = FINGER_TEMPO;
      if (d > 1) { ax = (zx - s.sx) / d; ay = (zy - s.sy) / d; }
      if (d < tempo * sek) tempo = d / sek;
    } else { ax = e.ax || 0; ay = e.ay || 0; }
    var alt = s.sx + s.sy;
    var nx = Math.max(SP_B / 2 + 1, Math.min(W - SP_B / 2 - 1, s.sx + ax * tempo * sek));
    if (spielerFrei(nx, s.sy)) s.sx = nx;
    var ny = Math.max(OBEN + ZONE * Z + SP_H, Math.min(BODEN_Y - 1, s.sy + ay * tempo * sek));
    if (spielerFrei(s.sx, ny)) s.sy = ny;
    if (Math.abs(s.sx + s.sy - alt) > .01) s.phase += dt * .012;

    // --- schiessen (Dauerfeuer) und nachdrehen ---
    s.schussPause -= dt;
    if (s.nachdrehenBis && uhr >= s.nachdrehenBis) { s.munition = MAGAZIN; s.nachdrehenBis = 0; }
    if (e.neu.b && !s.nachdrehenBis && s.munition < MAGAZIN) s.nachdrehenBis = uhr + NACHDREHEN_MS;
    if ((e.a || e.neu.a || e.klick || finger) && !s.tuete && !s.nachdrehenBis && s.munition > 0 && s.schussPause <= 0) {
      s.tuete = { x: Math.round(s.sx) - 2, y: s.sy - SP_H - 10 };
      s.munition--; s.verschossen++; s.schussPause = SCHUSS_PAUSE_MS;
      if (s.munition === 0) s.nachdrehenBis = uhr + NACHDREHEN_MS;
    }

    // --- der Wurm kriecht ---
    s.takt += dt;
    var t = takt();
    while (s.takt >= t) { s.takt -= t; s.wuermer.forEach(function (k) { k.forEach(gliedSchritt); }); }

    // --- Tablette fällt und lässt Zauberpilze fallen ---
    if (!s.tablette && s.welle >= TABLETTE_AB_WELLE && pilzeIn(ZONE, ZEILEN) < TABLETTE_WENN_UNTER && Math.random() < TABLETTE_CHANCE)
      s.tablette = { c: zufall(SPALTEN), y: OBEN - 8, zeile: -1, leben: 2, v: TABLETTE_TEMPO };
    if (s.tablette) {
      var tb = s.tablette; tb.y += tb.v * sek;
      var zr = Math.floor((tb.y + 4 - OBEN) / Z);
      if (zr !== tb.zeile) { tb.zeile = zr; if (zr > 0 && zr < ZEILEN - 1 && !pilz(tb.c, zr) && Math.random() < TABLETTE_PILZ) pilzSetzen(tb.c, zr, PILZ_LEBEN); }
      if (tb.y > BODEN_Y) s.tablette = null;
    }

    // --- die Schabe aus der Küche: zickzack unten, frisst Pilze ---
    if (!s.schabe) {
      s.schabeUhr += dt;
      if (s.schabeUhr > SCHABE_ALLE_MS * (0.7 + Math.random() * 0.6)) {
        s.schabeUhr = 0;
        var links = Math.random() < .5;
        s.schabe = { x: links ? -10 : W + 1, y: OBEN + ZONE * Z + zufall((ZEILEN - ZONE) * Z - 6), vx: (links ? 1 : -1) * SCHABE_TEMPO * (.7 + Math.random() * .6) * (1 + .05 * s.welle), vy: SCHABE_TEMPO * (Math.random() < .5 ? 1 : -1), bild: 0 };
      }
    } else {
      var sb = s.schabe; sb.x += sb.vx * sek; sb.y += sb.vy * sek; sb.bild += dt;
      var top = OBEN + (ZONE - 2) * Z, unten = BODEN_Y - 6;
      if (sb.y < top) { sb.y = top; sb.vy = Math.abs(sb.vy); } else if (sb.y > unten) { sb.y = unten; sb.vy = -Math.abs(sb.vy); }
      if (Math.random() < 2 * sek) sb.vy = -sb.vy;
      var fc = Math.floor((sb.x + 4) / Z), fr = Math.floor((sb.y + 2 - OBEN) / Z);
      if (pilz(fc, fr) && Math.random() < .5 * sek * 10) pilzSetzen(fc, fr, 0);
      if (sb.x < -14 || sb.x > W + 14) s.schabe = null;
    }

    // --- Tüte fliegt ---
    if (s.tuete) tueteFliegt(sek);

    // --- erwischt? ---
    var r = spielerRect(s.sx, s.sy), getroffen = false;
    s.wuermer.forEach(function (k) { k.forEach(function (g) { var p = segPos(g); if (ueberlapp(r[0], r[1], r[2], r[3], p.x + 1, p.y + 1, 5, 5)) getroffen = true; }); });
    if (s.tablette && ueberlapp(r[0], r[1], r[2], r[3], s.tablette.c * Z + 2, s.tablette.y, 4, 8)) getroffen = true;
    if (s.schabe && ueberlapp(r[0], r[1], r[2], r[3], s.schabe.x + 1, s.schabe.y + 1, 7, 4)) getroffen = true;
    if (getroffen) { spielerTreffer(); return; }

    if (!s.wuermer.length) { stern(160, 110, ['WURMFREI!', 'AFİYET OLSUN!', 'SUMPF SAUBER!'][s.welle % 3]); naechsteWelle(); }
  }

  function tueteFliegt(sek) {
    var t = s.tuete, weg = 0, schritte = Math.ceil(TUETE_TEMPO * sek / 4);
    for (var n = 0; n < schritte && s.tuete; n++) {
      t.y -= TUETE_TEMPO * sek / schritte;
      if (t.y < OBEN) { s.tuete = null; return; }
      var mx = t.x + 2, my = t.y;
      // Wurmglied?
      for (var ki = 0; ki < s.wuermer.length; ki++) {
        var k = s.wuermer[ki];
        for (var i = 0; i < k.length; i++) {
          var p = segPos(k[i]);
          if (ueberlapp(t.x, t.y, 4, 6, p.x, p.y, 7, 7)) { gliedTreffer(ki, i); s.tuete = null; return; }
        }
      }

      if (s.tablette && ueberlapp(t.x, t.y, 4, 6, s.tablette.c * Z + 1, s.tablette.y, 6, 8)) { tabletteTreffer(); s.tuete = null; return; }

      if (s.schabe && ueberlapp(t.x, t.y, 4, 6, s.schabe.x, s.schabe.y, 9, 6)) { schabeTreffer(); s.tuete = null; return; }

  }

  function gliedTreffer(ki, i) {
    var k = s.wuermer[ki], g = k[i], p = segPos(g), kopf = i === 0;

  }
  function tabletteTreffer() {

  function schabeTreffer() {

  // ---------- Zeichnen ----------
  var BILDER = {};
  function pixelBild(schluessel, karte, pal, zeilen) {

  function szene() {

    s.wuermer.forEach(function (k) { for (var i = k.length - 1; i >= 0; i--) if (k[i].r >= 0) gliedMalen(k[i], i === 0, i); });

  // eine kleine Vorführ-Szene für den Titel (ohne Spielstand)
  function titelWurm(px, py, laenge) {
