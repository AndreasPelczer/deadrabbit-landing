<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KNOLLENALARM</title>
<style>
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f1eee4; font-family: system-ui, sans-serif; }
  main { width: 100%; max-width: 960px; }
  #kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0; font-size: 15px; }
  canvas { cursor: none; touch-action: none; width: 100%; display: block; aspect-ratio: 4 / 3; background: #10131b; border: 2px solid #f1eee4; image-rendering: pixelated; }
  .hilfe { opacity: .7; }
  /* Handy hochkant: kein Rand verschenken, die Tasten-Hilfe braucht dort keiner */
  @media (max-width: 700px) and (orientation: portrait) {
    body { padding-inline: 4px; }
    .hilfe { display: none; }
    canvas { border-width: 1px; }
  }
  /* Handy quer: das Spielfeld so gross wie der Bildschirm hoch ist, nichts abgeschnitten */
  @media (orientation: landscape) and (max-height: 700px) {
    body { padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); min-height: 100vh; min-height: 100dvh; }
    main { width: auto; max-width: none; }
    #kopf { display: none; }
    canvas { border: 0; width: calc(100vh * 4 / 3); width: min(calc(100dvh * 4 / 3), calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); height: auto; }
  }
</style>
</head>
<body>
<main>
  <div id="kopf">
    <strong>KNOLLENALARM – KARTOFFELKÄFER ÜBER WERTHEIM</strong>
    <span class="hilfe">Stick/Pfeile: laufen · Leertaste/A: Tüte · R/B: nachdrehen · Finger halten: laufen · Tippen: Feuer · Esc: Menü</span>
  </div>
  <canvas id="spiel" width="320" height="240"></canvas>
</main>
<script src="../gemeinsam/arcade.js"></script>
<script>
(function () {
  'use strict';
  var A = ARCADE, W = A.W, H = A.H, COL = A.COL, x = null;

  // ---------- Einstellbar ----------
  var LEBEN = 3, EXTRA_LEBEN_BEI = 1500;
  var SPALTEN = 9, REIHEN = 5, ABSTAND_X = 22, ABSTAND_Y = 15, START_X = 40, START_Y = 32, START_Y_PRO_WELLE = 6, START_Y_MAX = 30;
  var GEGNER_B = 12, GEGNER_H = 9, REIHEN_ART = [0, 1, 1, 2, 2];
  var SCHRITT_X = 2, SCHRITT_RUNTER = 6, RAND = 6;
  var TAKT_MIN_MS = 26, TAKT_MAX_MS = 560, TAKT_WELLE = 0.15;      // Marschtakt: je weniger Knollen, desto schneller
  var SPIELER_Y = 220, SPIELER_T = 0.55, SPIELER_TEMPO = 110, FINGER_TEMPO = 170, SPIELER_HALB = 6;
  var MAGAZIN = 5, NACHDREHEN_MS = 1100, SCHUSS_PAUSE_MS = 240, SCHUSS_MAX = 2, TUETE_TEMPO = 230;
  var BREI_TEMPO = 68, BREI_TEMPO_WELLE = 6, BREI_PAUSE_MS = 1250, BREI_PAUSE_WELLE = 110, BREI_PAUSE_MIN = 380, BREI_MAX = 2, BREI_MAX_GANZ = 6;
  var BONUS_ALLE_MS = 15000, BONUS_Y = 15, BONUS_TEMPO = 46, BONUS_PUNKTE = [50, 100, 150, 300], ALF_JEDES = 4, ALF_PUNKTE = 500;
  var KISTEN = 4, KISTE_B = 22, KISTE_H = 14, KISTE_Y = 174;
  var STERNE_MAX = 2, STERN_MS = 800, STERN_JEDER = 5;
  var TREFFER_MS = 1900, WELLE_MS = 2300, EROBERT_MS = 2600, TITEL_WECHSEL_MS = 4500;
  var BODEN_Y = 222;
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var LISTE = A.liste('sumpf-invasion');
  var ZURUECK = '../index.html';

  // ---------- Die Knollen ----------
  var PAL = { k: '#111111', o: '#e2742a', K: '#1a1a1a', y: '#f2d23a', b: '#b07a3e', B: '#7a4f22', w: '#ffffff',
              G: '#7fae4a', D: '#5a8a32', g: '#d6f08a', r: '#c8302a', L: '#d0782a', F: '#8a5a2a' };
  var ARTEN = [
    { name: 'KARTOFFELKÄFER', punkte: 30, bilder: [
      ['..L......L..', '...L....L...', '....oKKo....', '..yyyyyyyy..', '.yKyKyyKyKy.', 'LyKyKyyKyKyL', '.yKyKyyKyKy.', 'L.yKyyyyKy.L', '...yyyyyy...'],
      ['.L........L.', '..L......L..', '....oKKo....', '..yyyyyyyy..', 'LyKyKyyKyKyL', '.yKyKyyKyKy.', 'LyKyKyyKyKyL', '..yKyyyyKy..', '...yyyyyy...']] },
    { name: 'KARTOFFEL', punkte: 20, bilder: [
      ['....bbbb....', '..bbBbbbbb..', 'FbKKbbbbKKbF', 'FbbwKbbwKbbF', '.bbbbbbbbBb.', '.bbBbKKKbbb.', '.bbbbbbbbbb.', '..bbbbbBbb..', '.F..F..F..F.'],
      ['....bbbb....', '..bbBbbbbb..', '.bKKbbbbKKb.', 'FbbwKbbwKbbF', 'FbbbbbbbbBbF', '.bbBbKKKbbb.', '.bbbbbbbbbb.', '..bbbbbBbb..', '..F.F..F.F..']] },
    { name: 'GRÜNE KNOLLE', punkte: 10, bilder: [
      ['...g...g....', '....g.g.....', '...GGGGGG...', '..GGKGGKGG..', '.GGGwGGwGGG.', '.GDGGGGGGDG.', '.GGGrrrrGGG.', '..GGGGGGGG..', '..D......D..'],
      ['....g...g...', '.....g.g....', '...GGGGGG...', '..GGKGGKGG..', '.GGGwGGwGGG.', '.GDGGGGGGDG.', '.GGGrrrrGGG.', '..GGGGGGGG..', '.D........D.']] }
  ];
  var DACKEL = [
    ['..........BB..', '.........bbbbk', 'b........bkbb.', 'bbbbbbbbbbbb..', '.bbbbbbbbbb...', '.b.b.....b.b..'],
    ['..........BB..', '.........bbbbk', '.b.......bkbb.', 'bbbbbbbbbbbb..', '.bbbbbbbbbb...', 'b...b...b...b.']];
  var DACKEL_PAL = { b: '#7a4a22', B: '#4a2a12', k: '#111111' };
  var KISTE_FARBEN = [null, '#b8322a', '#5a3412', '#e8c040', '#7a1e18', '#1a0d0a', '#e6b48a'];

  var WELLEN = ['DIE KARTOFFELN KOMMEN!', 'JETZT MIT SCHALE', 'FRÜHKARTOFFELN – FLINKER!', 'FESTKOCHEND UND SAUER',
                'DIE KÄFER HABEN HUNGER', 'MEHLIG. GEFÄHRLICH. MEHLIG.', 'ALI: DAS IST KEIN WITZ MEHR', 'DIE GANZE ERNTE'];
  var STERN_WOERTER = ['PÜREE!', 'MATSCH!', 'PLOPP!', 'POMMES!', 'GESCHÄLT!', 'BRATKARTOFFEL!', 'ŞEREFE!', '¡OLÉ!'];
  var WITZE = ['WER ANDEREN EINE GRUBE GRÄBT, PFLANZT KARTOFFELN.', 'MAN SOLL DIE KNOLLE NICHT VOR DEM SCHÄLEN LOBEN.',
               'ERST DIE ARBEIT, DANN DIE POMMES.', 'KARTOFFELN HABEN AUGEN. SIE HABEN DICH GESEHEN.', 'ALLES HAT EIN ENDE, NUR DIE KARTOFFEL HAT ZWEI.'];
  var LAUFTEXT = '+++ WERTHEIM IN GEFAHR +++ DIE KARTOFFELN WOLLEN AUF DIE BURG +++ DIE DÜMMSTEN BAUERN HABEN DIE DICKSTEN KARTOFFELN – UND DIE STEHEN JETZT VOR DER TÜR +++ KARTOFFELKÄFER: GELB, GESTREIFT, NULL RESPEKT +++ TÜTE LEER? NACHDREHEN! +++ GRÜNE KNOLLEN NICHT ESSEN +++ ¿DÓNDE ESTÁ ALF? +++ DER PIZZA-BLITZ LIEFERT AUCH IM KRIEG +++ WERDÖ A MOH +++ ';

  // Figur je Verteidiger (wer zuerst stirbt, macht Platz für den nächsten)
  var FIGUR = [['kumpel', 'kumpel'], ['wanderer', 'wanderer'], ['sprinter', 'sprinter'], ['sani', 'sani']];

  // ---------- Zustand ----------
  var modus = 'titel', seit = 0, uhr = 0, name = [0, 11, 5], namePos = 0, platz = -1, endeWahl = 0, s = null;

  function setzeModus(m) { modus = m; seit = uhr; }
  function mischen(l) { l = l.slice(); for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = l[i]; l[i] = l[j]; l[j] = t; } return l; }

  function kisteNeu(nr) {
    var p = [], abstand = W / KISTEN;
    for (var yy = 0; yy < KISTE_H; yy++) for (var xx = 0; xx < KISTE_B; xx++) {
      var f = 0;
      if (yy < 4) { var b = (xx - 1) % 4; if (xx >= 1 && xx <= 20 && b < 2) f = yy === 0 ? 3 : 2; }     // Kronkorken + Flaschenhälse
      else {
        f = 1;
        if (yy === 4 || yy === KISTE_H - 1 || xx === 0 || xx === KISTE_B - 1) f = 4;
        if (yy >= 6 && yy <= 7 && xx >= 8 && xx <= 13) f = 5;                                            // Griffloch
        if (yy === 10 && xx >= 4 && xx <= 17 && xx % 3 !== 0) f = 6;                                      // Aufschrift, unleserlich
      }
      p.push(f);
    }
    return { x: Math.round(abstand * nr + abstand / 2 - KISTE_B / 2), y: KISTE_Y, p: p };
  }

  function neuesSpiel() {
    var leute = mischen(A.TRUPPE).slice(0, LEBEN);
    s = { punkte: 0, welle: 0, leben: LEBEN, leute: leute, wer: 0, treffer: 0, verschossen: 0, abgeschossen: 0,
          sx: W / 2, phase: 0, munition: MAGAZIN, nachdrehenBis: 0, schussPause: 0,
          tueten: [], brei: [], pfuetzen: [], splitter: [], sterne: [], meldung: null,
          gegner: [], fx: 0, fy: 0, richtung: 1, takt: 0, bild: 0, breiUhr: 0,
          bonus: null, bonusUhr: 0, bonusZahl: 0, extra: false, grund: '', dackel: null, kisten: [] };
    for (var i = 0; i < KISTEN; i++) s.kisten.push(kisteNeu(i));
    naechsteWelle();
  }

  function naechsteWelle() {
    s.welle++;
    s.gegner = [];
    for (var r = 0; r < REIHEN; r++) for (var sp = 0; sp < SPALTEN; sp++) s.gegner.push({ spalte: sp, reihe: r, art: REIHEN_ART[r], lebendig: true });
    s.fx = START_X; s.fy = START_Y + Math.min(START_Y_MAX, (s.welle - 1) * START_Y_PRO_WELLE); s.richtung = 1; s.takt = 0;
    s.tueten = []; s.brei = []; s.bonus = null; s.bonusUhr = 0; s.breiUhr = 0;
    s.munition = MAGAZIN; s.nachdrehenBis = 0;
    if (s.welle > 1) s.dackel = { x: -20, bild: 0 };                     // der Dackel räumt die Pfützen weg
    setzeModus('welle');
  }

  // ---------- Hilfen ----------
  function gegnerPos(g) { return { x: s.fx + g.spalte * ABSTAND_X, y: s.fy + g.reihe * ABSTAND_Y }; }
  function lebende() { return s.gegner.filter(function (g) { return g.lebendig; }); }
  function ueberlapp(l1, o1, b1, h1, l2, o2, b2, h2) { return l1 < l2 + b2 && l1 + b1 > l2 && o1 < o2 + h2 && o1 + h1 > o2; }
  function spielerHoehe() { return A.spriteHoehe(SPIELER_T); }
  function wer() { return s.leute[s.wer] || 'ALF'; }
  function melden(t, farbe, ms) { s.meldung = { t: t, farbe: farbe || COL.hell, bis: uhr + (ms || 2200) }; }
  function stern(px, py, wort) {
    if (s.sterne.length >= STERNE_MAX) return false;
    s.sterne.push({ x: Math.max(30, Math.min(W - 30, px)), y: Math.max(26, Math.min(200, py)), wort: wort, start: uhr });
    return true;
  }
  function splittern(px, py, farben, n) {
    for (var i = 0; i < n; i++) s.splitter.push({ x: px, y: py, vx: (Math.random() - .5) * 90, vy: (Math.random() - .8) * 70, f: farben[i % farben.length], bis: uhr + 350 + Math.random() * 250 });
  }
  function punkte(n) {
    s.punkte += n;
    if (!s.extra && s.punkte >= EXTRA_LEBEN_BEI) {
      s.extra = true; s.leben++;
      var neu = s.leute.indexOf('AHMED') < 0 ? 'AHMED' : mischen(A.TRUPPE.filter(function (n) { return s.leute.indexOf(n) < 0; }))[0];
      s.leute.push(neu);
      melden(neu === 'AHMED' ? 'AHMED KOMMT MIT BRATWURST: +1 LEBEN' : neu + ' KOMMT DAZU: +1 LEBEN', COL.feuer, 3000);
    }
  }

  // ---------- Bierkisten ----------
  function kisteTrifft(l, o, b, h, vonOben) {
    for (var i = 0; i < s.kisten.length; i++) {
      var k = s.kisten[i];
      if (!ueberlapp(l, o, b, h, k.x, k.y, KISTE_B, KISTE_H)) continue;
      var x0 = Math.max(0, Math.floor(l - k.x)), x1 = Math.min(KISTE_B - 1, Math.floor(l + b - 1 - k.x));
      for (var n = 0; n < KISTE_H; n++) {
        var yy = vonOben ? n : KISTE_H - 1 - n;
        if (k.y + yy < o || k.y + yy >= o + h) continue;
        for (var xx = x0; xx <= x1; xx++) if (k.p[yy * KISTE_B + xx]) { sprengen(k, xx, yy); return true; }
      }
    }
    return false;
  }
  function sprengen(k, cx, cy) {
    for (var dy = -3; dy <= 3; dy++) for (var dx = -3; dx <= 3; dx++) {
      var xx = cx + dx, yy = cy + dy, d = dx * dx + dy * dy;
      if (xx < 0 || yy < 0 || xx >= KISTE_B || yy >= KISTE_H) continue;
      if (d <= 2 || (d <= 9 && Math.random() < .55)) k.p[yy * KISTE_B + xx] = 0;
    }
  }
  function kistenPixel() { var n = 0; s.kisten.forEach(function (k) { k.p.forEach(function (v) { if (v) n++; }); }); return n; }

  // ---------- Ablauf ----------
  function schritt(dt, e) {
    uhr += dt;
    if (modus === 'titel') { if (e.neu.a || e.klick) { name = name.slice(); namePos = 0; setzeModus('name'); } return; }
    if (modus === 'name') { nameSchritt(e); return; }
    if (modus === 'ende') {
      if (e.neu.o || e.neu.u || e.neu.l || e.neu.r) endeWahl = 1 - endeWahl;
      if (e.klick && uhr - seit > 600 && e.klick.y > 188) { endeWahl = e.klick.y < 203 ? 0 : 1; e.neu.a = true; }
      if (e.neu.a && uhr - seit > 600) { if (endeWahl === 0) neuesSpiel(); else if (typeof location !== 'undefined') location.href = ZURUECK; }
      return;
    }
    effekte(dt);
    if (modus === 'welle') {
      if (s.dackel) dackelSchritt(dt);
      if (uhr - seit > WELLE_MS || ((e.neu.a || e.klick) && uhr - seit > 700)) { s.dackel = null; s.pfuetzen = []; setzeModus('spiel'); if (s.welle === 1) melden(wer() + ' HAT DIE ZWILLE', COL.blau); }
      return;
    }
    if (modus === 'treffer') {
      if (uhr - seit > TREFFER_MS) {
        if (s.leben > 0) {
          s.wer++; s.brei = []; s.tueten = []; s.munition = MAGAZIN; s.nachdrehenBis = 0;
          melden(wer() === 'ALF' ? 'ALF ÜBERNIMMT – UNSICHTBAR, AUCH FÜR DICH' : wer() + ' ÜBERNIMMT DIE ZWILLE', COL.blau, 2600);
          setzeModus('spiel');
        } else spielEnde('brei');
      }
      return;
    }
    if (modus === 'erobert') { if (uhr - seit > EROBERT_MS) spielEnde('erobert'); return; }
    if (modus === 'spiel') spielSchritt(dt, e);
  }

  function nameSchritt(e) {
    if (e.neu.o) name[namePos] = (name[namePos] + 1) % ABC.length;
    if (e.neu.u) name[namePos] = (name[namePos] + ABC.length - 1) % ABC.length;
    if (e.neu.l && namePos > 0) namePos--;
    if (e.neu.r || e.neu.a) nameWeiter();
    if (e.klick && e.klick.y > 144 && e.klick.x > 90 && e.klick.x < 230) { namePos = 0; neuesSpiel(); return; }   // FERTIG-Knopf
    if (e.klick) {
      var spalte = Math.round((e.klick.x - 130) / 30);
      if (spalte >= 0 && spalte <= 2) namePos = spalte;
      if (e.klick.y < 106) name[namePos] = (name[namePos] + 1) % ABC.length;
      else if (e.klick.y > 126) name[namePos] = (name[namePos] + ABC.length - 1) % ABC.length;
      else nameWeiter();
    }
  }
  function nameWeiter() { namePos++; if (namePos > 2) { namePos = 0; neuesSpiel(); } }

  function effekte(dt) {
    var sek = dt / 1000;
    s.splitter.forEach(function (p) { p.x += p.vx * sek; p.y += p.vy * sek; p.vy += 220 * sek; });
    s.splitter = s.splitter.filter(function (p) { return p.bis > uhr; });
    s.sterne = s.sterne.filter(function (st) { return uhr - st.start < STERN_MS; });
    s.pfuetzen = s.pfuetzen.filter(function (p) { return p.bis > uhr; });
    if (s.meldung && s.meldung.bis < uhr) s.meldung = null;
  }

  function dackelSchritt(dt) {
    var d = s.dackel; d.x += 120 * dt / 1000; d.bild = Math.floor(Math.abs(d.x) / 6) % 2;
    s.pfuetzen = s.pfuetzen.filter(function (p) { return p.x > d.x + 12 || p.x < d.x - 4 ? true : false; });
    if (d.x > W + 20) s.dackel = null;
  }

  function spielSchritt(dt, e) {
    var sek = dt / 1000, alt = s.sx;
    // --- laufen: Stick, oder Finger halten ---
    if (e.maus && e.maus.unten) {
      var ziel = Math.max(SPIELER_HALB + 2, Math.min(W - SPIELER_HALB - 2, e.maus.x)), schrittweite = FINGER_TEMPO * sek;
      if (Math.abs(ziel - s.sx) <= schrittweite) s.sx = ziel; else s.sx += ziel > s.sx ? schrittweite : -schrittweite;
    } else if (e.ax) s.sx += e.ax * SPIELER_TEMPO * sek;
    s.sx = Math.max(SPIELER_HALB + 2, Math.min(W - SPIELER_HALB - 2, s.sx));
    if (Math.abs(s.sx - alt) > .01) s.phase += dt * .012;

    // --- schiessen und nachdrehen ---
    s.schussPause -= dt;
    if (s.nachdrehenBis && uhr >= s.nachdrehenBis) { s.munition = MAGAZIN; s.nachdrehenBis = 0; }
    if (e.neu.b && !s.nachdrehenBis && s.munition < MAGAZIN) s.nachdrehenBis = uhr + NACHDREHEN_MS;
    if ((e.a || e.neu.a || e.klick) && !s.nachdrehenBis && s.munition > 0 && s.schussPause <= 0 && s.tueten.length < SCHUSS_MAX) {
      s.tueten.push({ x: Math.round(s.sx) - 2, y: SPIELER_Y - spielerHoehe() - 12 });
      s.munition--; s.verschossen++; s.schussPause = SCHUSS_PAUSE_MS;
      if (s.munition === 0) s.nachdrehenBis = uhr + NACHDREHEN_MS;
    }

    // --- Knollen marschieren ---
    var leben = lebende(), gesamt = s.gegner.length;
    if (!leben.length) { stern(160, 110, ['ALLES PÜREE!', 'AFİYET OLSUN!', 'BRATKARTOFFELN!'][s.welle % 3]); naechsteWelle(); return; }
    var takt = Math.max(TAKT_MIN_MS, (TAKT_MIN_MS + (TAKT_MAX_MS - TAKT_MIN_MS) * leben.length / gesamt) / (1 + TAKT_WELLE * (s.welle - 1)));
    s.takt += dt;
    if (s.takt >= takt) {
      s.takt = 0; s.bild = 1 - s.bild;
      var minX = 999, maxX = -999;
      leben.forEach(function (g) { var p = gegnerPos(g); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x + GEGNER_B); });
      var weite = SCHRITT_X * (leben.length === 1 ? 2 : 1);
      if ((s.richtung > 0 && maxX + weite > W - RAND) || (s.richtung < 0 && minX - weite < RAND)) { s.fy += SCHRITT_RUNTER; s.richtung = -s.richtung; }
      else s.fx += s.richtung * weite;
    }
    var unten = 0;
    leben.forEach(function (g) {
      var p = gegnerPos(g); unten = Math.max(unten, p.y + GEGNER_H);
      s.kisten.forEach(function (k) {                        // wer durch die Kiste marschiert, frisst sie auf
        if (!ueberlapp(p.x, p.y, GEGNER_B, GEGNER_H, k.x, k.y, KISTE_B, KISTE_H)) return;
        for (var yy = 0; yy < KISTE_H; yy++) for (var xx = 0; xx < KISTE_B; xx++)
          if (ueberlapp(p.x, p.y, GEGNER_B, GEGNER_H, k.x + xx, k.y + yy, 1, 1)) k.p[yy * KISTE_B + xx] = 0;
      });
    });
    if (unten >= SPIELER_Y - spielerHoehe() + 4) { s.grund = 'erobert'; stern(160, 120, 'KNOLLEN-INVASION!'); setzeModus('erobert'); return; }

    // --- Kartoffelbrei fallen lassen ---
    s.breiUhr += dt;
    var pause = Math.max(BREI_PAUSE_MIN, BREI_PAUSE_MS - (s.welle - 1) * BREI_PAUSE_WELLE), maxBrei = Math.min(BREI_MAX_GANZ, BREI_MAX + s.welle - 1);
    if (s.breiUhr >= pause && s.brei.length < maxBrei) {
      s.breiUhr = Math.random() * pause * .3;
      var spalten = {};
      leben.forEach(function (g) { if (!spalten[g.spalte] || spalten[g.spalte].reihe < g.reihe) spalten[g.spalte] = g; });
      var kandidaten = Object.keys(spalten).map(function (k) { return spalten[k]; }), schuetze = null;
      if (Math.random() < .4) kandidaten.forEach(function (g) { var p = gegnerPos(g); if (Math.abs(p.x + GEGNER_B / 2 - s.sx) < 14) schuetze = g; });
      if (!schuetze) schuetze = kandidaten[Math.floor(Math.random() * kandidaten.length)];
      var sp = gegnerPos(schuetze);
      s.brei.push({ x: sp.x + GEGNER_B / 2 - 1, y: sp.y + GEGNER_H, v: BREI_TEMPO + BREI_TEMPO_WELLE * (s.welle - 1) + Math.random() * 15, w: Math.random() * 6 });
    }
