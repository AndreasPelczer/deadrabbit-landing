<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HÜTTENMAMPF</title>
<style>
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f1eee4; font-family: system-ui, sans-serif; }
  main { width: 100%; max-width: 960px; }
  #kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0; font-size: 15px; }
  canvas { cursor: none; touch-action: none; width: 100%; display: block; aspect-ratio: 4 / 3; background: #10131b; border: 2px solid #f1eee4; image-rendering: pixelated; }
  .hilfe { opacity: .7; }
  /* Handy hochkant: kein Rand verschenken */
  @media (max-width: 700px) and (orientation: portrait) {
    body { padding-inline: 4px; }
    .hilfe { display: none; }
    canvas { border-width: 1px; }
  }
  /* Handy quer: das Spielfeld so gross wie der Bildschirm hoch ist, nichts abgeschnitten */
  @media (orientation: landscape) and (max-height: 700px) {
    body { padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); min-height: 100vh; min-height: 100dvh; }
    main { width: auto; max-width: none; }
    #kopf { display: none; }
    canvas { border: 0; width: calc(100vh * 4 / 3); width: min(calc(100dvh * 4 / 3), calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))); height: auto; }
  }
</style>
</head>
<body>
<main>
  <div id="kopf">
    <strong>HÜTTENMAMPF – POMMES-PANIK IM SUMPF</strong>
    <span class="hilfe">Stick/Pfeile: laufen · Handy: wischen oder neben die Figur tippen · Escape: zurück zum Menü</span>
  </div>
  <canvas id="spiel" width="320" height="240"></canvas>
</main>
<script src="../gemeinsam/arcade.js"></script>
<script>
(function () {
  'use strict';
  var A = window.ARCADE, COL = A.COL, W = 320, H = 240, x = null;

  // ---------- Einstellbar ----------
  var T = 8, MX = 48, MY = 22;            // Kachelgroesse, Lage des Labyrinths auf der Leinwand
  // # Hecke  ~ Sumpf  H Huette  . Pommes  o Kurts Weizen  ' ' Weg ohne Futter  - Gartentor  P Dorfplatz (Start der Dorfbewohner)
  var KARTE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o#~~#.#~~~#.##.#~~~#.#~~#o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.HHHHHHHH.##.####.#',
    '#......##.HHHHHHHH.##......#',
    '######.##.HHHHHHHH.##.######',
    '~~~~~#.##          ##.#~~~~~',
    '~~~~~#.## ###--### ##.#~~~~~',
    '~~~~~#.## #PPPPPP# ##.#~~~~~',
    '      .   #PPPPPP#   .      ',
    '~~~~~#.## #PPPPPP# ##.#~~~~~',
    '~~~~~#.## ######## ##.#~~~~~',
    '~~~~~#.##          ##.#~~~~~',
    '######.## ######## ##.######',
    '#......#.....##.....#......#',
    '#.####.#.###.##.###.#.####.#',
    '#o#~~#.......  .......#~~#o#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################'
  ];
  var SP = 28, ZE = KARTE.length, TUNNEL_R = 12, BREITE = 30 * T;   // Tunnel: Kachel -1 und 28 liegen unter den Seitenleisten
  var START = { x: 14 * T, y: 19 * T + 4 }, TUER = { x: 14 * T, y: 9 * T + 4 }, MITTE_Y = 12 * T + 4;
  var BONUS_POS = { x: 14 * T, y: 15 * T + 4 };
  var VOLL = 0.08;                          // Pixel pro ms bei 100 % Tempo
  var LEBEN = 3, EXTRA_BEI = 10000, BONUS_BEI = [70, 170], BONUS_MS = 9500;
  var P_POMMES = 10, P_WEIZEN = 50, P_DORF = [200, 400, 800, 1600];
  var PHASEN = [7000, 20000, 7000, 20000, 5000, 20000, 5000, 1e12];   // abwechselnd: heim in die Ecke / jagen
  var STUFEN = [
    { kumpel: .80, dorf: .75, angst: .50, tunnel: .40, angstMs: 6000, elroy: 20, raus: [0, 0, 30, 60] },
    { kumpel: .88, dorf: .82, angst: .55, tunnel: .45, angstMs: 5000, elroy: 30, raus: [0, 0, 0, 50] },
    { kumpel: .92, dorf: .87, angst: .55, tunnel: .45, angstMs: 4000, elroy: 40, raus: [0, 0, 0, 0] },
    { kumpel: .96, dorf: .92, angst: .58, tunnel: .48, angstMs: 3000, elroy: 40, raus: [0, 0, 0, 0] },
    { kumpel: 1.0, dorf: .97, angst: .60, tunnel: .50, angstMs: 2200, elroy: 50, raus: [0, 0, 0, 0] }
  ];
  var BEREIT_MS = 2200, TOT_MS = 2600, GESCHAFFT_MS = 4600, RAUS_OHNE_POMMES = 4000, GEFRESSEN_PAUSE = 500;
  var WISCH = 10;                          // ab so vielen Pixeln ist es ein Wischer und kein Tippen
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var LISTE = A.liste('sumpf-mampf');

  // ---------- Die vier vom Dorf ----------
  var DORF = [
    { id: 'rudi',   name: 'RUDI',   spitz: 'DER SCHNELLE', info: 'IMMER DIR NACH',   farbe: '#ff4a3a', ecke: { c: 25, r: -3 }, sx: 14 * T, sy: 9 * T + 4, sdir: 'l',
      kopf: { k1: 'N', k2: 'R' }, pal: { N: '#2a1a10', R: '#e2283a', v: '#d8302a', V: '#8a1a14', p: '#33333f' },
      sagt: ['HALT, KNOLLE!', 'ZU LANGSAM!', 'HER MIT DEN POMMES!'], hau: 'ZACK!' },
    { id: 'manni',  name: 'MANNI',  spitz: 'MISTGABEL',    info: 'SCHNEIDET DEN WEG AB', farbe: '#ff7ab8', ecke: { c: 2, r: -3 }, sx: 14 * T, sy: 12 * T + 4, sdir: 'u',
      kopf: { k1: 'h', k2: 'H' }, pal: { h: '#e8c860', H: '#b8963a', v: '#ff4fa3', V: '#b83070', p: '#4a4a5c' },
      sagt: ['MEINE POMMES!', 'SCHÄL DICH!', 'ICH GABEL DICH!'], hau: 'GEGABELT!' },
    { id: 'frieda', name: 'FRIEDA', spitz: 'FACKEL',       info: 'UNBERECHENBAR',     farbe: '#5fd0e0', ecke: { c: 27, r: 25 }, sx: 12 * T, sy: 12 * T + 4, sdir: 'o',
      kopf: { k1: 'h', k2: 'H' }, pal: { h: '#3a4a6b', H: '#283350', v: '#5fd0e0', V: '#2a8a9a', p: '#5a4a3a' },
      sagt: ['GLEICH WIRD GEGRILLT!', 'BRATKARTOFFEL!', 'FEUER FREI!'], hau: 'ANGEBRATEN!' },
    { id: 'oma',    name: 'OMA HILDE', spitz: 'HAT ZEIT',  info: 'ACH, IHRE HÜFTE',   farbe: '#ffa04a', ecke: { c: 0, r: 25 }, sx: 16 * T, sy: 12 * T + 4, sdir: 'o',
      kopf: { k1: 'L', k2: 'L' }, pal: { L: '#9a4aa8', v: '#ff9a3a', V: '#b8601a', p: '#4a3a2a' },
      sagt: ['ACH, MEINE HÜFTE', 'JUNGE, ISS WAS!', 'FRÜHER GAB ES MEHR KARTOFFELN'], hau: 'HAB DICH!' }
  ];
  var BESOFFEN_SAGT = ['HICKS!', 'NOCH EINS, KURT!', 'ŞEREFE…', 'MIR IS SCHLECHT', 'WO IS MEIN HAUS?'];
  var BONUS = [
    { id: 'wurst',  name: 'BRATWURST',      von: 'AHMED',     p: 100,  ruf: 'AFİYET OLSUN!' },
    { id: 'paella', name: 'PAELLA',         von: 'TONI',      p: 300,  ruf: '¡OLÉ!' },
    { id: 'pizza',  name: 'PIZZA',          von: 'DER PIZZA-BLITZ', p: 500, ruf: 'BLITZ!' },
    { id: 'salat',  name: 'KARTOFFELSALAT', von: 'ALI',       p: 700,  ruf: 'BIO!' },
    { id: 'tuete',  name: 'TÜTE',           von: 'ALF (ANGEBLICH)', p: 1000, ruf: 'FRISCH GEDREHT!' }
  ];
  var WITZE = [
    ['ALI FRAGT: WAS SAGT DIE KARTOFFEL', 'ZUM PÜREE? „DU WARST AUCH MAL WAS!"'],
    ['KURT: WARUM IST EINE KARTOFFEL', 'NIE ALLEIN? SIE HAT ÜBERALL AUGEN.'],
    ['MURAT: POMMES SIND AUCH NUR', 'KARTOFFELN MIT AMBITIONEN.'],
    ['TONI: ¡OLÉ! DAS DORF HAT', 'WIEDER NUR KNOLLEN IM KOPF.'],
    ['AHMED: ERST DIE POMMES,', 'DANN DIE WURST. AFİYET OLSUN!'],
    ['¿DÓNDE ESTÁ ALF? KEINER WEISS ES.', 'DIE POMMES SIND AUCH WEG.'],
    ['GERD: WER IM SUMPF POMMES SUCHT,', 'FINDET MEISTENS KARTOFFELKÄFER.']
  ];
  var PLATT = ['IST PLATT WIE EIN RÖSTI', 'IST JETZT PÜREE', 'LIEGT IM KARTOFFELSACK', 'WURDE ZERSTAMPFT'];
  var TIPPS = ['KURTS WEIZEN MACHT DAS DORF MÜDE', 'TUNNEL LINKS UND RECHTS', 'POMMES SIND BIO, SAGT ALI', 'ALI HAT DIE KARTOFFELWITZE ABGESEGNET'];
  var LAUF = '+++ HÜTTENMAMPF +++ DAS DORF WILL SEINE POMMES ZURÜCK +++ KURTS WEIZEN MACHT DIE LEUTE MÜDE – PROST! ŞEREFE! +++ ' +
             'AHMEDS BRATWURST IN DER MITTE – AFİYET OLSUN! +++ TONIS PAELLA – ¡VAMOS! +++ WAS SAGT DIE KARTOFFEL ZUM PÜREE? DU WARST AUCH MAL WAS! +++ ' +
             '¿DÓNDE ESTÁ ALF? +++ WERDÖ A MOH +++ ';

  // ---------- Hilfen ----------
  var DX = { l: -1, r: 1, o: 0, u: 0 }, DY = { l: 0, r: 0, o: -1, u: 1 }, GEGEN = { l: 'r', r: 'l', o: 'u', u: 'o' };
  var REIHE = ['o', 'l', 'u', 'r'];                                     // Gleichstand: oben vor links vor unten vor rechts
  function feld(c, r) {
    if (r < 0 || r >= ZE) return '#';
    if (c < 0 || c >= SP) return r === TUNNEL_R ? ' ' : '#';
    return KARTE[r].charAt(c);
  }
  function offen(c, r) { var ch = feld(c, r); return ch === '.' || ch === 'o' || ch === ' '; }
  function kachel(v) { return Math.floor(v / T); }
  function annaehern(v, ziel, schritt) { return Math.abs(ziel - v) <= schritt ? ziel : v + (ziel > v ? schritt : -schritt); }
  function mischen(l) { for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = l[i]; l[i] = l[j]; l[j] = t; } return l; }
  function stufe(l) { var st = STUFEN[Math.min(l, STUFEN.length) - 1], extra = Math.max(0, l - STUFEN.length);
    return { kumpel: st.kumpel, dorf: Math.min(1.05, st.dorf + extra * .01), angst: st.angst, tunnel: st.tunnel,
             angstMs: Math.max(1200, st.angstMs - extra * 200), elroy: st.elroy, raus: st.raus }; }
  function richtung(dx, dy) { return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'l' : 'r') : (dy < 0 ? 'o' : 'u'); }

  // ---------- Zustand ----------
  var modus = 'titel', modusSeit = 0, uhr = 0, name = [12, 0, 12], namePos = 0, endeWahl = 0, platz = -1, s = null;
  function setzeModus(m) {
    modus = m; modusSeit = uhr;
    if (m === 'ende') { platz = LISTE.eintragen(name.map(function (i) { return ABC[i]; }).join(''), s.punkte); endeWahl = 0; }
  }

  function neuesSpiel() {
    var truppe = mischen(A.TRUPPE.slice());
    s = { punkte: 0, level: 0, kumpels: truppe.slice(0, LEBEN), reserve: truppe.slice(LEBEN), gefallen: [], extraDa: false,
          stats: { pommes: 0, weizen: 0, dorf: 0, dorfPunkte: 0, bonus: 0, bonusPunkte: 0 }, teller: [], sterne: [],
          meldung: null, witz: 0, ersterStart: true };
    naechstesLevel();
  }
  function naechstesLevel() {
    s.level++; s.uebrig = 0;
    s.futter = KARTE.map(function (z) { return z.split('').map(function (ch) { var f = ch === '.' ? 1 : ch === 'o' ? 2 : 0; if (f) s.uebrig++; return f; }); });
    s.imLevel = 0; s.elroyGesagt = false;
    lebenStart();
  }
  function lebenStart() {
    s.k = { x: START.x, y: START.y, dir: 'l', letzte: 'l', blick: 'r', weg: 0, ziehtZiel: null };
    s.will = 'l';
    s.dorf = DORF.map(function (d, i) { return { i: i, x: d.sx, y: d.sy, dir: d.sdir, zustand: i === 0 ? 'frei' : 'drin', angst: false, umkehren: false, bob: d.sdir === 'u' ? -1 : 1, weg: 0, augenSeit: 0 }; });
    s.phase = 0; s.phaseZeit = 0; s.angstBis = 0; s.angstVoll = 1; s.combo = 0; s.seitPommes = 0; s.pommesLeben = 0;
    s.bonus = null; s.sprech = null; s.sprechPause = 5000; s.wisch = null; s.pause = 0; s.taeter = -1;
    setzeModus('bereit');
  }

  // ---------- Bewegung auf dem Raster ----------
  // Figur f {x,y,dir}: laeuft weg Pixel; an jeder Kachelmitte darf entscheide(f,c,r) die Richtung setzen (oder null = stehen).
  function laufen(f, weg, entscheide, nachher) {
    var sicher = 0;
    while (weg > 1e-6 && sicher++ < 40) {
      var c = kachel(f.x), r = kachel(f.y), cx = c * T + T / 2, cy = r * T + T / 2;
      if (Math.abs(f.x - cx) < 1e-4 && Math.abs(f.y - cy) < 1e-4) {
        f.x = cx; f.y = cy; entscheide(f, c, r);
        if (!f.dir) return;
      }
      var d = f.dir, n = d === 'r' ? cx - f.x : d === 'l' ? f.x - cx : d === 'u' ? cy - f.y : f.y - cy;
      if (n <= 1e-4) n += T;
      var st = Math.min(weg, n), vx = f.x;
      if (st >= n - 1e-9) { f.x += DX[d] * n; f.y += DY[d] * n; f.x = Math.round(f.x * 2) / 2; f.y = Math.round(f.y * 2) / 2; }   // genau auf die Mitte
      else { f.x += DX[d] * st; f.y += DY[d] * st; }
      weg -= st; f.weg += st;
      if (f.x < -T) f.x += BREITE; else if (f.x >= SP * T + T) f.x -= BREITE;   // Tunnel
      if (nachher && nachher(f, vx)) return;
    }
  }
  function kumpelEntscheidet(f, c, r) {
    if (s.will && offen(c + DX[s.will], r + DY[s.will])) f.dir = s.will;
    else if (f.dir && !offen(c + DX[f.dir], r + DY[f.dir])) f.dir = null;
    if (f.dir) f.letzte = f.dir;
  }
  function dorfZiel(g) {
    if (g.zustand === 'augen') return { c: 13, r: 9 };
    var k = s.k, kc = kachel(k.x), kr = kachel(k.y), d = k.dir || k.letzte;
    var jagd = s.phase % 2 === 1 || (g.i === 0 && s.elroy);
    if (!jagd) return DORF[g.i].ecke;
    if (g.i === 0) return { c: kc, r: kr };
    if (g.i === 1) return { c: kc + 4 * DX[d], r: kr + 4 * DY[d] };
    if (g.i === 2) { var ru = s.dorf[0], rc = kachel(ru.x), rr = kachel(ru.y), mc = kc + 2 * DX[d], mr = kr + 2 * DY[d]; return { c: mc + (mc - rc), r: mr + (mr - rr) }; }
    var ab = (kc - kachel(g.x)) * (kc - kachel(g.x)) + (kr - kachel(g.y)) * (kr - kachel(g.y));
    return ab > 64 ? { c: kc, r: kr } : DORF[3].ecke;
  }
  function dorfEntscheidet(g, c, r) {
    var moegl = REIHE.filter(function (d) { return d !== GEGEN[g.dir] && offen(c + DX[d], r + DY[d]); });
    if (!moegl.length) { g.dir = GEGEN[g.dir]; return; }
    if (g.angst) { g.dir = moegl[Math.floor(Math.random() * moegl.length)]; return; }
    var z = dorfZiel(g), best = moegl[0], bd = Infinity;
    moegl.forEach(function (d) { var dc = c + DX[d] - z.c, dr = r + DY[d] - z.r, ab = dc * dc + dr * dr; if (ab < bd) { bd = ab; best = d; } });
    g.dir = best;
  }
  function augenAmTor(g, vx) {
    if (g.zustand === 'augen' && Math.abs(g.y - TUER.y) < .01 && (vx - TUER.x) * (g.x - TUER.x) <= 0) { g.x = TUER.x; g.zustand = 'rein'; return true; }
    return false;
  }
  function imTunnel(f) { return kachel(f.y) === TUNNEL_R && (kachel(f.x) <= 4 || kachel(f.x) >= 23); }

  // ---------- Punkte, Sterne, Meldungen ----------
  function punkte(p) {
    var vorher = s.punkte; s.punkte += p;
    if (vorher < EXTRA_BEI && s.punkte >= EXTRA_BEI && s.reserve.length) { var neu = s.reserve.shift(); s.kumpels.push(neu); melden(neu + ' KOMMT DAZU – KARDEŞİM!', COL.blau); }
  }
  function stern(px, py, wort, zusatz) {
    s.sterne.push({ x: Math.max(MX + 30, Math.min(MX + SP * T - 30, MX + px)), y: Math.max(MY + 14, Math.min(MY + ZE * T - 14, MY + py - 10)), wort: wort, zusatz: zusatz, alter: 0 });
    while (s.sterne.length > 2) s.sterne.shift();                       // nie mehr als zwei Comic-Sterne
  }
  function melden(t, farbe, ms) { s.meldung = { t: t, farbe: farbe || COL.hell, bis: uhr + (ms || 2600) }; }
  function kumpelName() { return s && s.kumpels[0] || ''; }

  // ---------- Spiel-Schritt ----------
  function spielSchritt(dt) {
    var st = stufe(s.level), k = s.k;
    s.sterne.forEach(function (z) { z.alter += dt; }); s.sterne = s.sterne.filter(function (z) { return z.alter < 1100; });
    if (s.pause > 0) { s.pause -= dt; return; }                         // kurz stehen, wenn einer eingesammelt wurde
    if (s.angstBis > 0) { s.angstBis -= dt; if (s.angstBis <= 0) { s.angstBis = 0; s.dorf.forEach(function (g) { g.angst = false; }); } }
    else {
      s.phaseZeit += dt;
      if (s.phaseZeit >= PHASEN[s.phase]) { s.phaseZeit = 0; s.phase = Math.min(s.phase + 1, PHASEN.length - 1); s.dorf.forEach(function (g) { if (g.zustand === 'frei') g.umkehren = true; }); }
    }
    s.seitPommes += dt;
    freilassen(st);
    // der Kumpel
    if (k.dir && s.will === GEGEN[k.dir]) { k.dir = s.will; k.letzte = k.dir; }
    laufen(k, VOLL * st.kumpel * (imTunnel(k) ? .9 : 1) * dt, kumpelEntscheidet);
    if (k.dir === 'l' || k.dir === 'r') k.blick = k.dir;
    fressen(st);
    if (modus !== 'spiel') return;
    kollision(); if (modus !== 'spiel') return;
    // das Dorf
    if (!s.elroy && s.uebrig <= st.elroy) { s.elroy = true; if (!s.elroyGesagt) { s.elroyGesagt = true; melden('RUDI DREHT DURCH!', COL.rot); } }
    s.dorf.forEach(function (g) { dorfSchritt(g, dt, st); });
    kollision(); if (modus !== 'spiel') return;
    // Bonus-Futter in der Mitte
    if (s.bonus) {
      s.bonus.bis -= dt;
      if (s.bonus.bis <= 0) s.bonus = null;
      else if (Math.abs(k.y - BONUS_POS.y) < 3 && Math.abs(k.x - BONUS_POS.x) < 6) {
        var b = s.bonus.art; punkte(b.p); s.stats.bonus++; s.stats.bonusPunkte += b.p; s.teller.push(b.id);
        stern(BONUS_POS.x, BONUS_POS.y, b.ruf, '+' + b.p); melden(b.von + ': ' + b.name + '!', COL.feuer); s.bonus = null;
      }
    }
    // ab und zu meckert einer
    s.sprechPause -= dt;
    if (s.sprech && uhr > s.sprech.bis) s.sprech = null;
    if (s.sprechPause <= 0) {
      s.sprechPause = 6000 + Math.random() * 5000;
      var frei = s.dorf.filter(function (g) { return g.zustand === 'frei'; });
      if (frei.length) { var g = frei[Math.floor(Math.random() * frei.length)], l = g.angst ? BESOFFEN_SAGT : DORF[g.i].sagt; s.sprech = { i: g.i, t: l[Math.floor(Math.random() * l.length)], bis: uhr + 1700 }; }
    }
    if (s.uebrig <= 0) { s.bonus = null; s.sprech = null; setzeModus('geschafft'); }
  }
  function freilassen(st) {
    var drin = s.dorf.filter(function (g) { return g.zustand === 'drin'; });
    if (!drin.length) return;
    var g = drin[0];
    if (s.pommesLeben >= st.raus[g.i] || s.seitPommes > RAUS_OHNE_POMMES) { g.zustand = 'raus'; s.seitPommes = 0; }
  }
  function fressen(st) {
    var k = s.k, c = kachel(k.x), r = kachel(k.y);
    if (r < 0 || r >= ZE || c < 0 || c >= SP) return;
    var f = s.futter[r][c];
    if (!f || Math.abs(k.x - (c * T + 4)) > 3 || Math.abs(k.y - (r * T + 4)) > 3) return;
    s.futter[r][c] = 0; s.uebrig--; s.imLevel++; s.pommesLeben++; s.seitPommes = 0;
    if (f === 1) { s.stats.pommes++; punkte(P_POMMES); }
    else {
