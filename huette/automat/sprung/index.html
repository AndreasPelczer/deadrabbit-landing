<script>
(function () {

  var A = window.ARCADE, W = 320, H = 240, COL = A.COL, text = A.text;

  var STAMPF_V = 250, STAMPF_V_HOCH = 360;
  var UNVERWUNDBAR = 1600, NASS_MS = 1800, TOD_MS = 1500;
  var KB = 8, KH = 22;                                // Körper des Läufers
  var GY = 200, WASSER_Y = 214, ERTRUNKEN_Y = 234;
  var P_FERN = 0.15, P_MITTE = 0.5;                   // Parallax
  var LEN = 5900, ZIEL_X = 5680, HUETTE_X = 5720;
  var ZEIT_SOLL = 240;                                // Sekunden – bis dahin ist das Bier noch kalt
  var PUNKTE = { korken: 10, flasche: 100, kartoffel: 50, bauer: 200, kaefer: 100, kasten: 500, leben: 500, sekunde: 20 };
  var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var LISTE = A.liste('sumpf-sprung');

  // ---------- Sprüche ----------
  var PUEREE = ['PÜREE!', 'POMMES!', 'BREI!', 'GRATIN!', 'KLOSS!', 'RÖSTI!', 'CHIPS!'];
  var AUA = { kartoffel: ['KARTOFFEL 1 – DU 0', 'DIE KNOLLE HAT DICH!', 'ÜBERROLLT!'], bauer: ['MISTGABEL! AUA!', 'DER BAUER VERSTEHT KEINEN SPASS'],
    dackel: ['WADENBEISSER!', 'DER DACKEL HAT ZUGEBISSEN!'], nessel: ['BRENNNESSELN! JUCKT BIS MORGEN', 'AUTSCH! BRENNNESSELN'], kaefer: ['KARTOFFELKÄFER IM GESICHT!'] };
  var NASS = { main: 'PLATSCH! DER MAIN IST KALT!', bach: 'NASSE FÜSSE DE LUXE', sumpf: 'BLUBB. DER SUMPF BEHÄLT DEN SCHUH.' };
  var LAUFSCHRIFT = '   DIE JUNGS WARTEN IN DER HÜTTE   ***   BRING BIER MIT   ***   20 FLASCHEN = 1 KASTEN = 1 LEBEN   ***   KARTOFFELN SIND NICHT DEINE FREUNDE   ***   DACKEL TRITT MAN NICHT   ***   ¿DÓNDE ESTÁ ALF?   ***   ŞEREFE!   ***   WERDÖ A MOH   ';
  function eins(l) { return l[Math.floor(Math.random() * l.length)]; }

  // ---------- Das Level ----------
  function zufall(saat) { var z = saat; return function () { z = (z * 16807) % 2147483647; return (z - 1) / 2147483646; }; }
  function baue() {
    var L = { fest: [], beweger: [], gegner: [], sachen: [], deko: [], nesseln: [], pfuetzen: [], punkte: [] };
    function boden(x0, x1, art) { L.fest.push({ x: x0, y: GY, w: x1 - x0, h: 80, art: art, weg: true }); }
    function block(x0, y, w, h, art) { L.fest.push({ x: x0, y: y, w: w, h: h, art: art, hindernis: y + h >= GY }); }
    function steg(x0, y, w, art, weg) { L.fest.push({ x: x0, y: y, w: w, h: 4, art: art || 'holz', einweg: true, weg: !!weg }); }
    function beweger(art, x0, y0, x1, y1, w, h, periode, weg) { var b = { art: art, x0: x0, y0: y0, x1: x1, y1: y1, x: x0, y: y0, w: w, h: h, periode: periode, dx: 0, dy: 0, tol: 1, weg: !!weg }; L.beweger.push(b); L.fest.push(b); }
    function korken(x0, y, n, ab, bogen) { for (var i = 0; i < n; i++) L.sachen.push({ art: 'korken', x: x0 + i * (ab || 14), y: y - (bogen ? Math.round(Math.sin(i / Math.max(1, n - 1) * Math.PI) * bogen) : 0) }); }
    function flasche(x0, y) { L.sachen.push({ art: 'flasche', x: x0, y: y }); }
    function gegner(art, x0, xa, xb, extra) { var g = { art: art, x: x0, y: GY, xa: xa, xb: xb, vx: 0, vy: 0, richtung: -1, start: x0 }; for (var k in extra) g[k] = extra[k]; L.gegner.push(g); }
    function deko(art, x0, extra) { var d = { art: art, x: x0 }; for (var k in extra) d[k] = extra[k]; L.deko.push(d); }
    function punkt(x0, name, zeile, schildX) { L.punkte.push({ x: x0, name: name, zeile: zeile }); deko('ortsschild', schildX || x0 + 14, { name: name }); }

    // --- WERTHEIM: unter der Burg ---
    boden(0, 1300, 'pflaster');
    punkt(10, 'WERTHEIM', 'AUF ZUR HÜTTE! DIE JUNGS WARTEN.', 36);
    deko('schild', 112, { zeilen: ['A = SPRINGEN', 'HALTEN = HÖHER'] });
    [150, 470, 790, 1110].forEach(function (lx) { deko('laterne', lx); });
    korken(124, 186, 6, 14);
    L.pfuetzen.push({ x: 240, w: 26 }); korken(240, 168, 3, 12);
    block(320, 188, 16, 12, 'kiste'); block(336, 176, 16, 24, 'kiste'); block(352, 164, 16, 36, 'kiste'); flasche(360, 148);
    block(404, 188, 16, 12, 'kiste'); deko('dreher', 412, { y: 188, spruch: 'ICH DREH NOCH EINE. GEH SCHON VOR!' });
    gegner('kartoffel', 560);
    deko('schild', 610, { zeilen: ['B = RENNEN', '(WENN DU KANNST)'] });
    L.pfuetzen.push({ x: 660, w: 34 });
    steg(720, 162, 44, 'balkon'); korken(726, 150, 3, 14); flasche(742, 120);
    beweger('lift', 800, 186, 800, 132, 20, 10, 3200); flasche(810, 110);
    gegner('kartoffel', 900); gegner('kartoffel', 950);
    deko('schild', 990, { zeilen: ['STADTGÄRTNEREI', 'NICHT BETRETEN'] });
    L.nesseln.push({ x: 1012, w: 22 }); korken(1010, 172, 3, 10, 6);
    gegner('bauer', 1170, 1090, 1290, { variante: 0 }); flasche(1230, 160);

    // --- MAINBRÜCKE ---
    boden(1300, 1640, 'bruecke');
    punkt(1310, 'MAINBRÜCKE', 'NICHT RUNTERFALLEN. DER MAIN IST NASS.');
    deko('schild', 1360, { zeilen: ['URPHAR 3 KM', 'ZU FUSS: 1 KASTEN'] });
    korken(1400, 186, 5, 14); gegner('kartoffel', 1580);
    deko('bake', 1630); deko('schild', 1600, { zeilen: ['BAUSTELLE', 'SEIT 1987'] });
    korken(1646, 176, 3, 14, 10); flasche(1660, 150);
    boden(1690, 1830, 'bruecke'); korken(1730, 186, 4, 14);
    beweger('stamm', 1840, WASSER_Y, 1940, WASSER_Y, 44, 8, 4200, true);
    korken(1850, 196, 6, 18); flasche(1905, 170);
    boden(1990, 2300, 'bruecke');
    gegner('bauer', 2120, 2000, 2290, { variante: 1 }); korken(2030, 186, 4, 14); flasche(2250, 176);

    // --- URPHAR ---
    boden(2300, 2720, 'wiese');
    punkt(2320, 'URPHAR', 'VORSICHT: DIE BAUERN SIND WACH.');
    block(2420, 170, 50, 30, 'container'); flasche(2445, 150); deko('klaus', 2445, { spruch: 'KLAUS: HEUTE NUR KARTOFFELPIZZA!' });
    gegner('dackel', 2580, 2490, 2715);
    block(2640, 190, 26, 10, 'zaun'); korken(2600, 186, 3, 12);
    korken(2722, 176, 3, 16, 10);
    boden(2768, 3600, 'wiese');
    block(2830, 184, 24, 16, 'heu'); block(2854, 168, 24, 32, 'heu'); flasche(2866, 150); korken(2800, 186, 2, 12);
    gegner('bauer', 2960, 2895, 3040, { variante: 2 }); gegner('bauer', 3110, 3050, 3190, { variante: 0 });
    korken(2900, 186, 8, 14);
    block(3200, 186, 60, 14, 'mauer'); deko('dreher', 3236, { y: 186, spruch: 'SCHON DA. ABKÜRZUNG ÜBERN FRIEDHOF.' }); flasche(3215, 168);
    deko('toni', 3300, { spruch: '¡OLÉ! ¿DÓNDE ESTÁ ALF?' });
    deko('hanf', 3335); deko('hanf', 3352); deko('hanf', 3370); deko('hanf', 3388); deko('schild', 3404, { zeilen: ['TOMATEN', 'BIO'] });
    block(3330, 191, 70, 9, 'zaun');
    L.nesseln.push({ x: 3440, w: 20 }); korken(3436, 170, 3, 10, 6);
    deko('schild', 3490, { zeilen: ['KARTOFFELACKER', 'ERNTE LÄUFT (WEG)'] });
    gegner('kartoffel', 3560); gegner('kartoffel', 3600); gegner('kartoffel', 3650);

    // --- WALD ---
    boden(3600, 3840, 'wald');
    punkt(3620, 'WALD', 'HIER WACHSEN DIE KARTOFFELN WILD.');
    block(3700, 188, 14, 12, 'stumpf'); deko('alf', 3740);
    korken(3760, 186, 4, 14); korken(3844, 172, 3, 14, 12);
    boden(3890, 4060, 'wald');
    steg(3930, 160, 40, 'ast'); korken(3934, 148, 3, 14); flasche(3990, 118); steg(3980, 132, 30, 'ast');
    gegner('kaefer', 4020, 0, 0, { y0: 150 });
    beweger('stamm', 4070, 212, 4150, 212, 40, 8, 3600, true); korken(4080, 196, 5, 18);
    boden(4200, 4680, 'wald');
    L.nesseln.push({ x: 4280, w: 24 }); korken(4276, 170, 3, 12, 6);
    gegner('kaefer', 4350, 0, 0, { y0: 150 });
    deko('schild', 4380, { zeilen: ['VORSICHT', 'KARTOFFELN AM HANG'] });
    gegner('kartoffel', 4440); gegner('kartoffel', 4480);
    block(4500, 180, 14, 20, 'stumpf'); flasche(4507, 160);
    gegner('bauer', 4590, 4525, 4675, { variante: 1, fackel: true });
    deko('schild', 4640, { zeilen: ['ZUR HÜTTE', '------>'] });

    // --- SUMPF ---
    boden(4680, 4800, 'sumpf');
    punkt(4700, 'SUMPF', 'FAST DA. WERDÖ A MOH!');
    korken(4802, 178, 3, 14, 10);
    boden(4840, 4920, 'sumpf'); korken(4922, 178, 3, 14, 10);
    boden(4964, 5050, 'sumpf'); gegner('kaefer', 5010, 0, 0, { y0: 152 });
    beweger('stamm', 5060, WASSER_Y, 5200, WASSER_Y, 44, 8, 5000, true); korken(5070, 196, 7, 20); flasche(5150, 172);
    boden(5250, 5330, 'sumpf'); flasche(5290, 176);
    korken(5332, 176, 3, 16, 10);
    boden(5378, 5450, 'sumpf');
    steg(5470, 196, 30, 'steg', true); steg(5520, 190, 30, 'steg', true); steg(5570, 196, 30, 'steg', true); korken(5480, 178, 6, 20);
    boden(5620, LEN, 'wiese');
    deko('huette', HUETTE_X); deko('feuer', 5831); deko('jungs', 5640);
    deko('dreher', 5655, { y: GY - 12, kiste: true, spruch: 'WO BLEIBST DU DENN?' });
    block(5649, 188, 16, 12, 'kiste');
    return L;
  }

  // ---------- Zustand ----------
  var L = null, s = null, modus = 'titel', modusSeit = 0, zeit = 0, cam = 0;
  var name = [0, 11, 5], namePos = 0, platz = -1, endeWahl = 0;
  var finger = { benutzt: false, liste: [], sprungNeu: false };
  function setzeModus(m) { modus = m; modusSeit = zeit; }

  function neuerLaeufer(px) { return { x: px, y: GY, vx: 0, vy: 0, b: KB, h: KH, boden: true, auf: null, koyote: 0, puffer: 0, blick: 1, phase: 0, unverwundbar: 0, nass: 0, yAlt: GY }; }
  function neuesSpiel() {
    L = baue();
    s = { p: neuerLaeufer(40), leben: LEBEN, punkte: 0, flaschen: 0, korken: 0, zeit: 0, punkt: 0, funken: [], schwebe: [], comic: [], meldung: null,
          gegner: L.gegner, sachen: L.sachen, geplaettet: 0, tod: null, geschafft: false, zeitBonus: 0, lebenBonus: 0, blasen: {} };
    s.gegner.forEach(function (g) { g.b = g.art === 'kartoffel' ? 10 : g.art === 'dackel' ? 16 : g.art === 'kaefer' ? 10 : 10; g.h = g.art === 'kartoffel' ? 9 : g.art === 'dackel' ? 8 : g.art === 'kaefer' ? 8 : 24;
      g.tempo = g.art === 'kartoffel' ? 55 : g.art === 'dackel' ? 70 : g.art === 'kaefer' ? 30 : 26; g.aktiv = false; g.dreh = 0; g.schritt = 0; });
    cam = 0; melden(L.punkte[0].name, L.punkte[0].zeile);
  }
  function melden(t, zeile) { s.meldung = { t: t, zeile: zeile || '', seit: zeit }; }
  function schweben(t, wx, wy, farbe) { s.schwebe.push({ t: t, x: wx, y: wy, seit: zeit, farbe: farbe || COL.feuer }); }
  function comic(t, wx, wy, gr) { s.comic.push({ t: t, x: wx, y: wy, gr: gr || 10, seit: zeit }); }
  function funken(wx, wy, n, farbe, kraft) { for (var i = 0; i < n; i++) s.funken.push({ x: wx, y: wy, dx: (Math.random() - .5) * kraft, dy: -Math.random() * kraft, leben: 30 + Math.random() * 20, farbe: farbe }); }

  // ---------- Physik ----------
  function bewegen(k, sek, fest) {
    var hb = k.b / 2, i, f;
    k.wand = false;
    k.x += k.vx * sek;
    for (i = 0; i < fest.length; i++) {
      f = fest[i]; if (f.einweg) continue;
      if (k.x - hb < f.x + f.w && k.x + hb > f.x && k.y - k.h < f.y + f.h && k.y > f.y + 0.5) {
        if (k.x < f.x + f.w / 2) k.x = f.x - hb; else k.x = f.x + f.w + hb;
        k.vx = 0; k.wand = true;
      }
    }
    var alt = k.y, oben = null;
    k.y += k.vy * sek; k.boden = false; k.auf = null;
    for (i = 0; i < fest.length; i++) {
      f = fest[i];
      if (!(k.x - hb < f.x + f.w && k.x + hb > f.x)) continue;
      if (k.vy >= 0 && alt <= f.y + (f.tol || 0) + 0.5 && k.y >= f.y) { if (!oben || f.y < oben.y) oben = f; }
      else if (!f.einweg && k.vy < 0 && alt - k.h >= f.y + f.h - 0.5 && k.y - k.h < f.y + f.h) { k.y = f.y + f.h + k.h; k.vy = 0; }
    }
    if (oben) { k.y = oben.y; k.vy = 0; k.boden = true; k.auf = oben; }
  }
  function bodenDa(px, py, fest) { for (var i = 0; i < fest.length; i++) { var f = fest[i]; if (px >= f.x && px <= f.x + f.w && Math.abs(f.y - py) < 3) return true; } return false; }

  // Ein Schritt des Läufers. ein = { l, r, neu (Sprung gerade gedrückt), halten, rennen }
  function spielerSchritt(p, dt, ein, fest) {
    var n = Math.max(1, Math.ceil(dt / 17)), d = dt / n;
    if (ein.neu) p.puffer = PUFFER;
    for (var i = 0; i < n; i++) {
      var sek = d / 1000;
      p.puffer = Math.max(0, p.puffer - d);
      p.koyote = p.boden ? KOYOTE : Math.max(0, p.koyote - d);
      var richtung = (ein.r ? 1 : 0) - (ein.l ? 1 : 0);
      var ziel = richtung * (ein.rennen ? RENN : LAUF) * (p.nass > 0 ? .55 : 1);
      var a = p.boden ? (richtung ? BESCHL_BODEN : BREMSE) : BESCHL_LUFT;
      if (p.taumel > 0) { p.taumel -= d; a = 0; }          // nach einem Treffer fliegt man erst mal zurück
      if (p.vx < ziel) p.vx = Math.min(ziel, p.vx + a * sek); else if (p.vx > ziel) p.vx = Math.max(ziel, p.vx - a * sek);
      if (richtung) p.blick = richtung;
      if (p.puffer > 0 && p.koyote > 0) { p.vy = -SPRUNG_V; p.boden = false; p.koyote = 0; p.puffer = 0; p.auf = null; p.gesprungen = true; }
      var g = SCHWERE; if (p.vy < 0 && !ein.halten) g *= KURZ;
      p.vy = Math.min(FALL_MAX, p.vy + g * sek);
      bewegen(p, sek, fest);
      p.nass = Math.max(0, p.nass - d);
    }
    if (p.boden) p.phase += Math.abs(p.vx) * dt / 1000 / 7; else p.phase = 0;
  }

  function beweger(dt) {
    L.beweger.forEach(function (b) {
      var t = (1 - Math.cos((zeit / b.periode) * Math.PI * 2)) / 2, nx = b.x0 + (b.x1 - b.x0) * t, ny = b.y0 + (b.y1 - b.y0) * t;
      b.dx = nx - b.x; b.dy = ny - b.y; b.x = nx; b.y = ny; b.tol = Math.abs(b.dy) + 1;
    });
  }

  // ---------- Eingabe ----------
  function eingabe(e) {
    var ein = { l: e.l, r: e.r, neu: e.neu.a, halten: e.a, rennen: e.b };
    var zonen = [];
    if (finger.benutzt) zonen = finger.liste;
    else if (e.maus && e.maus.unten) zonen = [{ x: e.maus.x, y: e.maus.y }];
    zonen.forEach(function (f) {
      if (f.x < W / 2) { if (f.x < W / 4) ein.l = true; else ein.r = true; if (f.x < 30 || f.x > W / 2 - 30) ein.rennen = true; }
      else ein.halten = true;
    });
    if (finger.sprungNeu) { ein.neu = true; finger.sprungNeu = false; }
    if (!finger.benutzt && e.klick && e.klick.x >= W / 2) ein.neu = true;
    return ein;
  }

  // ---------- Spiel-Ablauf ----------
  function treffer(grund, wx, wy) {
    var p = s.p; if (p.unverwundbar > 0 || modus !== 'spiel') return;
    s.leben--;
    comic('AUTSCH!', wx, wy - 14, 9);
    if (s.leben <= 0) { tod(grund, eins(AUA[grund] || ['ERWISCHT!'])); return; }
    melden(eins(AUA[grund] || ['ERWISCHT!']), 'NOCH ' + s.leben + (s.leben === 1 ? ' LEBEN' : ' LEBEN'));
    p.unverwundbar = UNVERWUNDBAR; p.vy = -220; p.vx = -p.blick * 110; p.boden = false; p.taumel = 380;
  }
  function wasserArt(wx) { return wx < 2300 ? 'main' : wx < 4680 ? 'bach' : 'sumpf'; }
  function tod(grund, t) {
    var p = s.p;
    if (grund === 'wasser') { s.leben--; var art = wasserArt(p.x); t = NASS[art]; comic(art === 'sumpf' ? 'BLUBB!' : 'PLATSCH!', p.x, WASSER_Y - 22, 11); funken(p.x, WASSER_Y, 18, art === 'sumpf' ? '#6a7a3a' : '#9fd0ff', 3); }
    s.tod = { grund: grund, t: t };
    setzeModus('tod');
  }
  function wiederbeleben() {
    var cp = L.punkte[s.punkt], p = neuerLaeufer(cp.x + 30);
    p.unverwundbar = 2000; s.p = p; s.tod = null; cam = Math.max(0, Math.min(LEN - W, p.x - 130));
    melden('WEITER GEHT\'S', 'NOCH ' + s.leben + ' LEBEN');
    setzeModus('spiel');
  }
  function stampfen(g) {
    var p = s.p;
    p.vy = -(p.halten ? STAMPF_V_HOCH : STAMPF_V); p.boden = false;
    if (g.art === 'dackel') { g.flucht = true; g.richtung = p.x < g.x ? 1 : -1; schweben('WAU?!', g.x, g.y - 14, COL.rosa); if (!s.dackelGetreten) { s.dackelGetreten = true; melden('DACKEL TRITT MAN NICHT!', 'ER IST JETZT BELEIDIGT'); } return; }
