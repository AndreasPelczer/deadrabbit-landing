<!doctype html>

<title>URPHAED</title>
<style>
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; background: #10131b; color: #f1eee4; font-family: system-ui, sans-serif; }

  #kopf { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 12px 0; font-size: 15px; }
  canvas { cursor: none; touch-action: none; width: 100%; display: block; aspect-ratio: 4 / 3; background: #10131b; border: 2px solid #f1eee4; image-rendering: pixelated; }
  .hilfe { opacity: .7; }
</style>
</head>

  <div id="kopf">
    <strong>URPHAED – DER SUMPF</strong>
    <span class="hilfe">Maus: zielen · Linksklick/Tippen: Feuer · Rechtsklick/R: nachdrehen · oder Stick/Pfeile + Leertaste</span>
  </div>
  <canvas id="spiel" width="320" height="240"></canvas>
</main>

  function naechsteWelle() {

    s.munition = MAGAZIN; s.nachladenBis = 0;

      var wer = s.kumpels.splice(Math.floor(Math.random() * s.kumpels.length), 1)[0];

  function setzeModus(m) { modus = m; modusSeit = zeit; }

  // ---------- Wege und Körper ----------

    var y = 109 + t * 139;

  }
  function figur(px, py, t) {     // eine Person in der Tiefe t (0 = hinten, 1 = vorn)

  }
  function koerper(g) {
    var p = weg(g.seite, g.t);

      var b = 4 + Math.round(g.t * 12), h = 2 + Math.round(g.t * 6);
